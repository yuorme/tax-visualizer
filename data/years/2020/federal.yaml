# Federal parameters for 2020. Recurring benefits use July 2020–June 2021 amounts, applied to current-year
# income. Extraordinary pandemic-support payments are excluded. Calendar-year carbon records are in each province.
year: 2020

# CRA T4127 January 2020, table 9.1 and federal BPA formula.
brackets:
  - [48535, 0.15]
  - [97069, 0.205]
  - [150473, 0.26]
  - [214368, 0.29]
  - [.inf, 0.33]
basicPersonalAmount: {max: 13229, min: 12298, from: 150473, to: 214368}
quebecAbatement: 0.165
employmentAmount: 1245
indexation: 0.019

investment:
  # Schedule 3 gives 50%; Finance Canada's 2021 tax-expenditures report explicitly states 2020 dividend rates.
  capitalGainsInclusion: 0.5
  grossUp: {eligible: 1.38, nonEligible: 1.15}
  dividendTaxCredit: {eligible: 0.150198, nonEligible: 0.090301}
  # Treaty Article X(2)(b) and Income Tax Act 20(11), archived section in force June 2019–June 2023.
  foreignWithholding: {usTreaty: 0.15, deductibleAbove: 0.15}

rrsp: {rate: 0.18, limit: 27230}

# T4127 payroll caps/rates; ESDC's October–December 2020 table separates base and additional contributions.
# CPP2/QPP2 do not exist yet: no second band and zero second additional rate.
payroll:
  cpp: {exempt: 3500, ympe: 58700, yampe: 58700, base: 0.0495, enh1: 0.003, enh2: 0}
  qpp: {exempt: 3500, ympe: 58700, yampe: 58700, base: 0.054, enh1: 0.003, enh2: 0}
  ei: {maxInsurable: 54200, rate: 0.0158, quebecRate: 0.012}
  qpip: {maxInsurable: 78500, rate: 0.00494}

childBenefit: # T4114 July 2020–June 2021, printed pages 14–15.
  perChildUnder6: 6765
  perChild6to17: 5708
  threshold1: 31711
  threshold2: 68708
  rate1: [0, 0.07, 0.135, 0.19, 0.23]
  fixed2: [0, 2590, 4995, 7029, 8509]
  rate2: [0, 0.032, 0.057, 0.08, 0.095]

groceriesBenefit: # CRA recurring GST/HST calculation sheet, 2019 base year.
  name: GST/HST credit
  adult: 296
  spouseOrFirstChild: 296
  child: 155
  singleSupplement: {max: 155, rate: 0.02, from: 9590}
  phaseOut: {rate: 0.05, from: 38507}

workersBenefit: # Published 2020 Schedule 6; disability supplement excluded.
  # Quebec saturation thresholds are excluded earnings + published maximum / phase-in rate:
  # single 2400+2319.14/.274; couple 3600+3620.09/.274; parent 2400+1269.60/.15;
  # couple with children 3600+1849.68/.14. Exact quotients preserve the published dollar maxima.
  estimated: true
  estimationNote: "Quebec's income-at-maximum thresholds are derived from the published Schedule 6 maxima divided by their phase-in rates, plus excluded earnings; all benefit amounts and reduction thresholds are published 2020 values"
  standard: {max: [1381, 2379], rate: 0.26, floor: [3000, 3000], threshold: [13064, 17348], phaseOut: [0.12, 0.12]}
  # The secondary-earner exemption starts in 2021; 2020 Schedule 6 adds both spouses' net income without it.
  secondaryEarnerExemption: 0
  regional:
    AB: {max: [1481, 2216], rate: 0.21, floor: [2760, 2760], threshold: [13451, 18291], phaseOut: [0.12, 0.12]}
    NU: {max: [1085, 1630], rate: [0.10, 0.14], floor: [6000, 6000], threshold: [21654, 29551], phaseOut: [0.04, 0.08]}
  quebec:
    phaseOutRate: 0.20
    single: [0.274, 2400, 10864.014598540145, 12308.41]
    couple: [0.274, 3600, 16812.007299270073, 18897.5]
    parent: [0.15, 2400, 10864.0, 12304.8]
    coupleKids: [0.14, 3600, 16812.0, 18905.35]

