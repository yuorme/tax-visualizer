# Benefit-year figures use July 2020 to June 2021, applied to current-year income.
# Three months of under-6 early childhood benefit and nine months of under-18 opportunity benefit.
# Each annual formula is calculated separately, floored at zero, then weighted by 0.25 or 0.75.
# Early benefit annual $660 and 1.32% reduction per eligible child are statutory, not interpolated.
# Vancouver published residential total is 2.92568 mills / 1000.

code: BC
name: British Columbia
order: 0
brackets:
  - [41725, 0.0506]
  - [83451, 0.077]
  - [95812, 0.105]
  - [116344, 0.1229]
  - [157748, 0.147]
  - [220000, 0.168]
  - [.inf, 0.205]
basicPersonalAmount: 10949
dividendTaxCredit: {eligible: 0.12, nonEligible: 0.0196}
spouseAmount: {max: 9376, threshold: 938}
bcTaxReduction: {max: 476, rate: 0.0356, threshold: 21185}
salesTax: {rate: 0.12, label: 5% GST + 7% PST}
propertyTax: {rate: 0.00292568, city: Vancouver}
childBenefit:
  name: B.C. early childhood / child opportunity benefit
  program: bc-child-benefit-transition
  params:
    early: {weight: 0.25, perChild: 660, threshold: 100000, rate: 0.0132}
    opportunity:
      weight: 0.75
      max: [1600, 1000, 800]
      min: [700, 680, 660]
      singleParent: 0
      threshold: 25000
      minThreshold: 80000
      rate: 0.04
