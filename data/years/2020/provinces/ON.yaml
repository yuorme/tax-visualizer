# Benefit-year figures use July 2020 to June 2021, applied to current-year income.
# Child maximum annualizes rounded CRA monthly $121.75 × 12 = $1461.
# OEPTC property component is the published $844 property maximum minus $60 base = $784.
# Toronto total published rate is (0.446704 city + 0.153000 education) / 100.

code: ON
name: Ontario
order: 7
brackets:
  - [44740, 0.0505]
  - [89482, 0.0915]
  - [150000, 0.1116]
  - [220000, 0.1216]
  - [.inf, 0.1316]
basicPersonalAmount: 10783
dividendTaxCredit: {eligible: 0.1, nonEligible: 0.029863}
spouseAmount: {max: 9156, threshold: 915}
surtax:
  - [4830, 0.2]
  - [6182, 0.36]
ontarioTaxReduction: {base: 249, perChild: 460}
lift: {max: 850, rate: 0.0505, threshold: 30000, familyThreshold: 60000, phaseOut: 0.1}
payroll:
  healthPremium:
    - [200000, 750, 0.25, 900]
    - [72000, 600, 0.25, 750]
    - [48000, 450, 0.25, 600]
    - [36000, 300, 0.06, 450]
    - [20000, 0, 0.06, 300]
salesTax: {rate: 0.13, label: 13% HST}
propertyTax: {rate: 0.00599704, city: Toronto}
creditsUseRent: true
childBenefit:
  name: Ontario Child Benefit
  program: ontario-child-benefit
  params: {perChild: 1461, threshold: 22303, rate: 0.08}
  estimated: true
credits:
  - name: Ontario sales tax credit
    program: ontario-sales-tax-credit
    params: {perPerson: 313, rate: 0.04, thresholdSingle: 24115, thresholdFamily: 30143}
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit
    params: {rentShare: 0.2, energyMax: 241, propertyBase: 60, propertyRate: 0.1, propertyMax: 784, rate: 0.02, thresholdSingle: 24115, thresholdFamily: 30143}
