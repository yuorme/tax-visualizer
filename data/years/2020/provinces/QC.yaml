# Benefit-year figures use July 2020 to June 2021, applied to current-year income.
# Family allowance uses calendar 2020; solidarity credit uses July 2020–June 2021.
# Living-alone amount retains the model assumption that every one-adult household qualifies.
# Property estimate uses Ville-Marie: (0.6372 base + 0.1043 water + 0.0035 roads + 0.0024 ARTM
# + 0.0064 borough capital + 0.0418 borough services) / 100 = 0.007956.
# The 2020 citywide-average budget was unavailable; this explicitly uses a representative borough.

