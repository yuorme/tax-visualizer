code: QC
name: Quebec
order: 8
system: quebec     # Quebec runs its own income tax, QPP and QPIP
brackets:
  - [53255, 0.14]
  - [106495, 0.19]
  - [129590, 0.24]
  - [.inf, 0.2575]
basicPersonalAmount: 18571
dividendTaxCredit: {eligible: 0.117, nonEligible: 0.0342}
spouseAmount: transfer     # a spouse's unused basic credit is transferred instead
healthServicesFund:
  name: Quebec Health Services Fund
  program: qc-health-services-fund
  # Schedule F Part B, separate columns at 63060; lines 77–82, including both maxima.
  params: {threshold: 18130, upperThreshold: 63060, rate: 0.01, firstCap: 150, max: 1000}
quebec:
  workerDeduction: {rate: 0.06, max: 1420}
  livingAlone: {max: 2128, rate: 0.1875, threshold: 42090}
salesTax: {rate: 0.14975, label: "5% GST + 9.975% QST"}
propertyTax: {rate: 0.0090, city: Montreal, note: school tax may be extra, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
childBenefit:
  name: Family allowance
  program: quebec-family-allowance
  # July 2025 to June 2026 (Finances Québec, Parameters of the personal income tax system for 2025, Table 3)
  params: {max: 3006, maxSingleParent: 1055, min: 1196, minSingleParent: 421, rate: 0.04, thresholdSingle: 43280, thresholdCouple: 59369, schoolSupplies: 124}
credits:
  - name: Solidarity tax credit
    program: quebec-solidarity-tax-credit
    # July 2025 to June 2026 (Finances Québec, Table 4)
    params: {qstAdult: 356, qstSpouse: 356, qstAlone: 169, housingCouple: 888, housingSingle: 731, child: 155, rate: 0.06, threshold: 42325}
  - name: Work premium
    program: quebec-work-premium
    # Tax year 2025 general work premium (Finances Québec, Table 3; rates and excluded income from the CFFP guide)
    params:
      phaseOutRate: 0.10
      single: [0.116, 2400, 12620]        # [rate, excluded income, reduction threshold]
      couple: [0.116, 3600, 19534]
      parent: [0.30, 2400, 12620]
      coupleKids: [0.25, 3600, 19534]
childcareCredit:
  name: Quebec childcare expenses tax credit
  program: quebec-childcare
  # Year-end ages reflect under 16 during 2025 / under 14 during 2026; older infirm dependants remain eligible.
  params:
    youngUnder: 7
    eligibleThrough: 16
    annualYoung: 12275
    annualOther: 6180
    annualSevere: 16800
    rates: [[24795, 0.78], [43725, 0.75], [45340, 0.74], [46970, 0.73], [48570, 0.72], [50195, 0.71], [119835, 0.7], [.inf, 0.67]]
# Montreal adds the 3-cent ARTM tax. Cap-and-trade costs and sales tax are not added here.
fuelTax:
  gasoline: 0.192
  regional: {name: ARTM, gasoline: 0.03}   # Autorité régionale de transport métropolitain

sources:
  - {label: "Revenu Québec, 2025 Schedule F, Parts A and B (income base and contribution)", url: "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.F-V(2025-12).pdf"}
  - {label: "NWT Finance, Budget 2025-2026, B22 (provincial/territorial fuel tax rates at January 30, 2025; regional additions separate)", url: "https://www.fin.gov.nt.ca/sites/fin/files/resources/2025-26_budget_address_and_papers_final_0.pdf"}
  - {label: "Revenu Québec, Fuel tax rates (gasoline $0.1920 a litre, regular rate; archived September 11, 2025)", url: "http://web.archive.org/web/20250911061524/https://www.revenuquebec.ca/en/businesses/consumption-taxes/fuel-tax/fuel-tax-rates/"}
  - {label: "ARTM, Budget 2026 (ARTM gasoline tax: $0.03 a litre in its territory, not indexed since 1992)", url: "https://www.artm.quebec/wp-content/uploads/2025/12/RP_Budget_2026.pdf"}
  - {label: "Revenu Quebec, new childcare age limit in 2026", url: "https://www.revenuquebec.ca/en/press-room/tax-news/details/2025-09-23/new-age-limit-for-the-refundable-tax-credit-for-childcare-expenses/"}
  - {label: "Revenu Quebec, Schedule C pooled expenses and family income", url: "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.C-V%282025-12%29.pdf"}
  - {label: "Finances Quebec, 2025 and 2026 childcare expense limits and income rates, Tables 3 and 5", url: "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/finances/publications-adm/parametres/AUTEN_IncomeTax2026.pdf"}
  - {label: "Finances Québec, Parameters of the personal income tax system for 2025 (brackets, basic amount, worker deduction, living alone, family allowance, work premium, solidarity tax credit)", url: "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/finances/publications-adm/parametres/AUTEN_IncomeTax2025.pdf"}
  - {label: "Retraite Québec, 2025 benefit amounts and key data (family allowance)", url: "https://www.retraitequebec.gouv.qc.ca/en/benefits-amounts/2025-benefits-amounts-key-data"}
  - {label: "CFFP, Université de Sherbrooke, Guide des mesures fiscales: work premium (2025 rates and excluded income)", url: "https://cffp.recherche.usherbrooke.ca/outils-ressources/guide-mesures-fiscales/credit-impot-remboursable-prime-travail/"}
  - {label: "CFFP, Guide des mesures fiscales: solidarity tax credit (cross-check of Table 4)", url: "https://cffp.recherche.usherbrooke.ca/outils-ressources/guide-mesures-fiscales/credit-impot-solidarite/"}
  - {label: "Revenu Québec, 2025 tax rates", url: "https://www.revenuquebec.ca/en/citizens/income-tax-return/completing-your-income-tax-return/income-tax-rates/"}
  - {label: "CGTSIM, Understanding school tax (Montreal school tax is billed separately by the CGTSIM)", url: "https://www.cgtsim.qc.ca/en/understanding-school-tax/"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate, carried over to 2025)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 14800
  estimated: true
