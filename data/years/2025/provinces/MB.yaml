code: MB
name: Manitoba
order: 5
bracketsFrozenSince: 2025   # Manitoba's 2025 and 2026 budgets keep the limits unindexed
brackets:
  - [47000, 0.108]
  - [100000, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: {max: 15780, min: 0, from: 200000, to: 400000}
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
# MB428-A lines 1–3, 9, 11; Act s. 4.6(16.1)(b): eligible individual at any time in the year.
# The form's birth-year band includes children turning 18, assuming the parent qualified before then.
familyTaxBenefit:
  program: mb-family-tax-benefit
  claimant: higher-net-income
  # Interpretation, not a stated statutory rule: s. 4.6(16.2)(a) is silent on equal incomes.
  # Following #92, allow either spouse's whole child claim and choose the least household tax.
  tie: household-minimum
  params: {basic: 2065, dependant: 2065, child: 2752, reductionRate: 0.09, childThrough: 18}
salesTax: {rate: 0.12, label: "5% GST + 7% RST"}
propertyTax: {rate: 0.0138, city: Winnipeg, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
creditsUseRent: true
credits:
  - name: Homeowners affordability tax credit
    nameRenter: Renters affordability tax credit
    program: mb-affordability-credits
    params: {homeownerMax: 1500, renter: 575}
    estimated: true   # renters credit taken at its maximum
fuelTax: {gasoline: 0.125}   # $ per litre, from January 1, 2025

sources:
  - {label: "Manitoba Income Tax Act, s. 4.6(16.1)–(16.2) (family benefit eligibility and claimant limits)", url: "https://web2.gov.mb.ca/laws/statutes/ccsm/_pdf.php?cap=i10"}
  - {label: "CRA, 2025 MB428-A (ordinary family tax benefit bases and individual net-income taper)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-a/5007-a-25e.pdf"}
  - {label: "CRA, 2025 Manitoba guide (MB428-A dependent children, exclusions and higher-income spouse)", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/manitoba/5007-pc.html"}
  - {label: "NWT Finance, Budget 2025-2026, B22 (provincial/territorial fuel tax rates at January 30, 2025; regional additions separate)", url: "https://www.fin.gov.nt.ca/sites/fin/files/resources/2025-26_budget_address_and_papers_final_0.pdf"}
  - {label: "Manitoba Finance, Fuel Tax (clear gasoline 12.5¢ a litre from January 1, 2025)", url: "https://www.gov.mb.ca/finance/taxation/taxes/gasoline.html"}
  - {label: "Manitoba Finance, Personal income taxes (2025 brackets; indexation paused from the 2025 tax year)", url: "https://www.gov.mb.ca/finance/personal/ptaxes.html"}
  - {label: "Manitoba Finance, Personal tax credits (2025 basic and spouse amounts, affordability credits)", url: "https://www.gov.mb.ca/finance/personal/pcredits.html"}
  - {label: "CRA, Form MB428 for 2025", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-c/5007-c-25e.pdf"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate, carried over to 2025)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
    url: https://www150.statcan.gc.ca/n1/tbl/csv/25100060-eng.zip
  - label: "Carbon history: Natural Gas: A Primer"
    url: https://natural-resources.canada.ca/energy-sources/fossil-fuels/natural-gas-primer
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: Closed - Canada Carbon Rebate (CCR) for individuals"
    url: https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-carbon-rebate/how-much.html
  - label: "Carbon history: Lowering energy bills for Canadians across the country"
    url: https://www.canada.ca/en/department-finance/news/2023/10/lowering-energy-bills-for-canadians-across-the-country.html

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 49.77
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 49.2892 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 150
            spouse: 75
            child: 37.5
            firstChild: 75
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 150
            spouse: 75
            child: 37.5
            firstChild: 75
            threshold: [0, 0]
            rate: 0
