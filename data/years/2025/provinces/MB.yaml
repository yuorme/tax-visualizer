# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 49.77
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 49.2892 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 150
            spouse: 75
            child: 37.5
            firstChild: 75
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 150
            spouse: 75
            child: 37.5
            firstChild: 75
            threshold: [0, 0]
            rate: 0

seniorCredits:
  provisionalRules: false
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 3728, threshold: 27749, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1000}}
  transfer: schedule2-unused-base
  familyBenefit: {program: mb-family-senior-terms, params: {minimumAge: 65, own: 2065, spouse: 2065}}

