    params: {adult: 429, spouse: 429, child: 169, maxChildren: 2, rate: 0.02884, threshold: 38588}
    estimated: true   # reduction rate worked out from the published start and end points: 1,196 / (80,058 - 38,588)
fuelTax: {gasoline: 0.15}   # $ per litre

