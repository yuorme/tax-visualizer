childBenefit:
  name: NWT Child Benefit
  program: nwt-child-benefit-age-groups
  params:
    # Exact annual amounts from NWT Finance; count each age group separately.
    # T4114-25 confirms continuity for July 2025 to June 2026; apply to current-year income.
    under6: [0, 815, 1467, 1997, 2445]
    under6More: 367
    over6: [0, 652, 1174, 1597, 1956]
    over6More: 293
    fullUpTo: 30000
    endsAt: 80000
fuelTax: {gasoline: 0.107}   # Zone A (highway system), including Yellowknife

