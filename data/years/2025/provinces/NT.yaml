# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 11000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Carbon pricing
  heating:
    amount: 0
    estimated: true
    method: Estimated 2406 L/year oil proxy from a 2012 Deline residential-building feasibility assumption, reused for the territory; not measured Yellowknife household use. Calendar-day diesel heating rebates apply.
  rebates:
    - name: Cost of Living Offset
      program: carbon-rebate-payments
      params:
        payments:
          - date: 2025-01-01
            adult: 110.25
            spouse: 110.25
            child: 126.25
            firstChild: 126.25
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 110.25
            spouse: 110.25
            child: 126.25
            firstChild: 126.25
            threshold: [0, 0]
            rate: 0
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0

seniorCredits:
  provisionalRules: false
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 8727, threshold: 45522, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1000}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: territorial-senior-supplement
    name: Northwest Territories Senior Citizen Supplementary Benefit
    params:
      monthly: 196
    reporting:
      kind: t5007
      exemptThrough: 0
