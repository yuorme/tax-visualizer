code: NB
name: New Brunswick
order: 9
brackets:
  - [51306, 0.094]
  - [102614, 0.14]
  - [190060, 0.16]
  - [.inf, 0.195]
basicPersonalAmount: 13396
dividendTaxCredit: {eligible: 0.14, nonEligible: 0.0275}
spouseAmount: {max: 10499, threshold: 1051}     # base amount 11,550 on Form NB428, maximum 10,499
lowIncomeReduction:
  program: nb-low-income-reduction
  # Form NB428: $802 reduced by 3% of income over $21,920 (the form's limits of $48,653 single and $75,387 family
  # fit: 21,920 + 802 / 0.03 and 21,920 + 1,604 / 0.03)
  params: {amount: 802, rate: 0.03, threshold: 21920}
salesTax: {rate: 0.15, label: "15% HST"}
propertyTax: {rate: 0.0136, city: Moncton, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
childBenefit:
  name: NB Child Tax Benefit
  program: nb-child-tax-benefit
  params:
    perChild: 250                  # $20.83 a month
    threshold: 20000
    rateOneChild: 0.025
    rateMoreChildren: 0.05
    workingIncomeSupplement: {rate: 0.04, floor: 3750, max: 250, threshold: 20921, phaseOut: 0.05}
credits:
  - name: New Brunswick HST credit
    program: nb-hst-credit
    params: {adult: 300, spouse: 300, child: 100, rate: 0.02, threshold: 35000}
sources:
