  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 99.45
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 98.4908 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
