            adult: 225
            spouse: 112.5
            child: 56.25
            firstChild: 112.5
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 228
            spouse: 114
            child: 57
            firstChild: 114
            threshold: [0, 0]
            rate: 0
