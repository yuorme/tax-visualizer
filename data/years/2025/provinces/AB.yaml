code: AB
name: Alberta
order: 2
# The new 8% bracket applies to all of 2025 (CRA's page notes the July 1 payroll start); credits are at 8% too.
brackets:
  - [60000, 0.08]
  - [151234, 0.10]
  - [181481, 0.12]
  - [241974, 0.13]
  - [362961, 0.14]
  - [.inf, 0.15]
basicPersonalAmount: 22323
dividendTaxCredit: {eligible: 0.0812, nonEligible: 0.0218}
spouseAmount: {max: 22323, threshold: 0}
salesTax: {rate: 0.05, label: "5% GST"}
propertyTax: {rate: 0.0066, city: Calgary, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
childBenefit:
  name: Alberta Child and Family Benefit
  program: alberta-child-family-benefit
  params:
    base: [1499, 2248, 2997, 3746]          # by number of children, 1 to 4+ (1,499 + 749 for each later child)
    baseRate: [0.08, 0.12, 0.16, 0.20]
    baseThreshold: 27565
    working: [767, 1465, 1883, 2021]        # 767 + 698 + 418 + 138, cumulative
    workingRate: 0.15
    workingFloor: 2760
    workingThreshold: 46191
    workingPhaseOut: 0.15
  estimated: true   # base reduction rates are the 2026 file's approximation; CRA publishes only the start and maximums
sources:
