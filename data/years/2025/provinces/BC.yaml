# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 12900
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: BC carbon tax
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 48
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 48.5060 GJ gas and 0.2385 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: BC climate action tax credit
      params:
        payments:
          - date: 2025-01-01
            adult: 126
            spouse: 63
            child: 31.5
            firstChild: 63
            threshold: [41071, 57288]
            rate: 0.005
          - date: 2025-04-01
            adult: 126
            spouse: 63
            child: 31.5
            firstChild: 63
            threshold: [41071, 57288]
            rate: 0.005

seniorCredits:
  provisionalRules: false
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 5799, threshold: 43169, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1000}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: bc-senior-supplement
    name: BC Senior's Supplement
    params:
      single: 99.3
      couple: 110.25
      allowance: 99.83
      allowanceProtection: 100
      minimum: 1
    # Allowance protection $100 is inferred from published mixed-couple rows; continue ordinary receipt from first GIS month.
    estimated: true
    reporting:
      kind: t5007
      exemptThrough: 500
