code: BC
name: British Columbia
order: 0          # position in the west-to-east sort
brackets:
  - [49279, 0.0506]
  - [98560, 0.077]
  - [113158, 0.105]
  - [137407, 0.1229]
  - [186306, 0.147]
  - [259829, 0.168]
  - [.inf, 0.205]
basicPersonalAmount: 12932
dividendTaxCredit: {eligible: 0.12, nonEligible: 0.0196}
spouseAmount: {max: 11073, threshold: 1108}     # base amount 12,181 on Form BC428, maximum 11,073
bcTaxReduction: {max: 562, rate: 0.0356, threshold: 25020}
salesTax: {rate: 0.12, label: "5% GST + 7% PST"}
propertyTax: {rate: 0.0030, city: Vancouver, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
creditsUseRent: true
childBenefit:
  name: B.C. family benefit
  program: bc-family-benefit
  params: {max: [1750, 1100, 900], min: [775, 750, 725], singleParent: 500, rate: 0.04, threshold: 29526, minThreshold: 94483}
credits:
  - name: B.C. renter's tax credit
    program: bc-renters-tax-credit
    params: {max: 400, rate: 0.02, threshold: 64764}
# Vancouver: 1.75 cents general revenue + 6.75 cents BCTFA, plus 18.5 cents TransLink.
# The separate carbon program retains the gasoline carbon tax through March 31, 2025.
fuelTax:
  gasoline: 0.085
  area: Vancouver area
  regional: {name: TransLink, gasoline: 0.185}

