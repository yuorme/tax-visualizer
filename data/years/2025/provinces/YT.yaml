code: YT
name: Yukon
territory: true
order: 1
brackets:
  - [57375, 0.064]
  - [114750, 0.09]
  - [177882, 0.109]
  - [500000, 0.128]
  - [.inf, 0.15]
basicPersonalAmount: federal      # Yukon's amount mirrors the federal one, including its phase-out
dividendTaxCredit: {eligible: 0.1202, nonEligible: 0.0067}
spouseAmount: federal
employmentAmountCredit: true      # Yukon has its own Canada employment amount credit
salesTax: {rate: 0.05, label: "5% GST"}
propertyTax: {rate: 0.0100, city: "Whitehorse (est.)", estimated: true, rough: true}   # no published rate used: a rough placeholder
childBenefit:
  name: Yukon Child Benefit
  program: per-child-reduced
  params: {perChild: 936.96, threshold: 35000, rateOneChild: 0.025, rateMoreChildren: 0.05}     # $78.08 a month
fuelTax: {gasoline: 0.062}   # $ per litre

sources:
  - {"label": "Yukon Tax", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5011-c/5011-c-25e.pdf"}
  - {"label": "Territorial Amounts Transferred from your Spouse or Common-Law Partner", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5011-s2/5011-s2-25e.pdf"}
  - {label: "NWT Finance, Budget 2025-2026, B22 (provincial/territorial fuel tax rates at January 30, 2025; regional additions separate)", url: "https://www.fin.gov.nt.ca/sites/fin/files/resources/2025-26_budget_address_and_papers_final_0.pdf"}
  - {label: "Yukon, Find current fuel tax rates (gasoline 6.2¢ a litre; archived July 11, 2025)", url: "http://web.archive.org/web/20250711190021/https://yukon.ca/en/fuel-tax-rates"}
  - {label: "CRA, Form YT428 for 2025 (basic personal amount mirrors the federal one)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5011-c/5011-c-25e.pdf"}
  - {label: "CRA, 2025 tax rates and income brackets", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/last-year.html"}
  - {label: "CRA, T4114 (Yukon child benefit, July 2025 to June 2026)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4114/t4114-25e.pdf"}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Lowering energy bills for Canadians across the country"
    url: https://www.canada.ca/en/department-finance/news/2023/10/lowering-energy-bills-for-canadians-across-the-country.html
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: Yukon historical carbon rebates"
    url: https://yukon.ca/en/doing-business/taxation/learn-about-federal-price-pollution-and-yukons-carbon-rebate
  - label: "Carbon history: Yukoners to receive first carbon rebate in October"
    url: https://open.yukon.ca/information/b1cbb21a-1e7d-4bd5-b4ee-01b04901749c/resource/8189483c-ed69-49b2-8842-34def020c30a/download/19-237.html
  - label: "Carbon history: Yukon Bill33 Carbon Price Rebate Implementation Act — payment rules"
    url: https://yukonassembly.ca/sites/default/files/inline-files/34-2-Bill033-Carbon-Price-Rebate-Implementation-Act.pdf
  - label: "Carbon history: Yukon Financial Advisory Panel final report,2017 — heating-use proxy"
    url: https://yukon.ca/sites/yukon.ca/files/fin/fin-yukon-financial-advisory-panel-final-report-2017.pdf

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 13200
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Carbon pricing
  heating:
    amount: 0
    estimated: true
    method: "Estimated 1750 L/year oil-heated-home proxy: midpoint of the Yukon 2017 advisory report range (1500–2000 L); held fixed across years, not a territorial household mean. Calendar-day charge rates and heating-oil exemptions apply."
  rebates:
    - name: Yukon carbon rebate
      program: carbon-rebate-payments
      params:
        payments:
          - date: 2025-01-01
            adult: 77.5
            spouse: 77.5
            child: 77.5
            firstChild: 77.5
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 77.5
            spouse: 77.5
            child: 77.5
            firstChild: 77.5
            threshold: [0, 0]
            rate: 0
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0

seniorCredits:
  provisionalRules: false
  age: {program: federal-age-copy, params: {}}
  pension: {program: federal-pension-capped, params: {maximum: 2000}}
  transfer: schedule2-unused-base
