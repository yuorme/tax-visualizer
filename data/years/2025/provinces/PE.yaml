code: PE
name: Prince Edward Island
shortName: PEI
order: 10
brackets:
  - [33328, 0.095]
  - [64656, 0.1347]
  - [105000, 0.166]
  - [140000, 0.1762]
  - [.inf, 0.19]
basicPersonalAmount: 14650      # Form PE428 for 2025; it rises to $15,000 from January 1, 2026
dividendTaxCredit: {eligible: 0.105, nonEligible: 0.013}
spouseAmount: {max: 12443, threshold: 1244}     # base amount 13,687 on Form PE428, maximum 12,443
claimants:
  childAmount: {claimant: lower-net-income, transfer: none}
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: true, order: before-foreign-tax-credit}
# PE428 line 58230: $100 per eligible month, annualized using the existing under-6 child count.
# Birthdays/residence changes within the year are not prorated; see verification/162-pei-young-children.md.
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 350, spouse: 350, child: 300, rate: 0.05, threshold: 22650}
salesTax: {rate: 0.15, label: "15% HST"}
propertyTax: {rate: 0.0167, city: Charlottetown}   # WOWA's 2025 row: 0.67% municipal + 1% provincial
childBenefit:
  name: PEI Child Benefit
  program: income-band-per-child
  params:
    bands: [[45000, 360], [80000, 240]]    # [family net income below, amount per child]: $30 and $20 a month
credits:
  # July 2025 to June 2026 is the last year of the old sales tax credit (see docs/verification/2025-rule-shapes.md)
  - name: PEI sales tax credit
    program: pei-sales-tax-credit
    params: {individual: 110, spouseOrDependant: 55, supplementRate: 0.005, supplementFrom: 30000, supplementMax: 55, rate: 0.02, threshold: 50000}
# Regulatory clean-fuel cost allowances are not taxes paid to government and are excluded.
fuelTax: {gasoline: 0.0847}   # $ per litre, fixed since January 1, 2020

sources:
  - {label: "CRA PE428 2025, line 58230 young-child base and 9.5% credit conversion", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.pdf"}
  - {label: "CRA PE(S2) 2025, transferable pool excludes young-child amount", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-s2/5002-s2-25e.pdf"}
  - {label: "CRA PE 2025 guide, claimant and transfer rules", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/prince-edward-island/5002-pc.html"}
  - {label: "NWT Finance, Budget 2025-2026, B22 (provincial/territorial fuel tax rates at January 30, 2025; regional additions separate)", url: "https://www.fin.gov.nt.ca/sites/fin/files/resources/2025-26_budget_address_and_papers_final_0.pdf"}
  - {label: "Prince Edward Island, Gasoline Tax Rates (8.47¢ a litre from January 1, 2020; archived July 18, 2025)", url: "http://web.archive.org/web/20250718105940/https://www.princeedwardisland.ca/en/information/finance/gasoline-tax-rates"}
  - {label: "Island Regulatory and Appeals Commission, Maximum Consumer Petroleum Prices (PEI provincial tax 8.47¢, federal excise 10.0¢; effective August 1, 2025, archived)", url: "http://web.archive.org/web/20250803162328/https://irac.pe.ca/petrol/current-petroleum-prices/maximum-consumer-price-schedule/"}
  - {label: "CRA PE428 2025, reduction before FTC (87–89), unused balance before FTC (99–101)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.pdf"}
  - {label: "CRA T2036 2025, line 5 credit cap and note 4 tax otherwise payable", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2036/t2036-25e.pdf"}
  - {label: "CRA, 2025 tax rates and income brackets", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/tax-rates-brackets/last-year.html"}
  - {label: "CRA, T4114 (PEI child benefit, July 2025 to June 2026)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4114/t4114-25e.pdf"}
  - {label: "CRA, RC4210 (PEI sales tax credit, 2025-2026)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/rc4210/rc4210-25e.txt"}
  - {label: "WOWA, Charlottetown property tax (2025 residential rate: 0.67% municipal + 1% provincial)", url: "https://wowa.ca/taxes/charlottetown-property-tax"}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
    url: https://www150.statcan.gc.ca/n1/tbl/csv/25100060-eng.zip
  - label: "Carbon history: Natural Gas: A Primer"
    url: https://natural-resources.canada.ca/energy-sources/fossil-fuels/natural-gas-primer
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: Closed - Canada Carbon Rebate (CCR) for individuals"
    url: https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-carbon-rebate/how-much.html
  - label: "Carbon history: Lowering energy bills for Canadians across the country"
    url: https://www.canada.ca/en/department-finance/news/2023/10/lowering-energy-bills-for-canadians-across-the-country.html

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15100
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 0
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 0.0000 GJ gas and 35.2661 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 110
            spouse: 55
            child: 27.5
            firstChild: 55
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 110
            spouse: 55
            child: 27.5
            firstChild: 55
            threshold: [0, 0]
            rate: 0
