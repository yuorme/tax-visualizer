# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 16200
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 58.86
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 58.2901 GJ gas and 1.0275 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 140
            spouse: 70
            child: 35
            firstChild: 70
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 151
            spouse: 75.5
            child: 37.75
            firstChild: 75.5
            threshold: [0, 0]
            rate: 0

seniorCredits:
  provisionalRules: false
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 6223, threshold: 46330, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1762}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: on-gains
    name: Ontario GAINS
    params:
      reduction: 0.5
      singleStep: 24
      coupleStep: 48
      olderAge: 75
      quarterly:
        - maximum: 87
          youngerOffsets: [0, 0, 8736, 8736]
          olderOffsets: [0, 0, 9648, 9648]
        - maximum: 87
          youngerOffsets: [0, 0, 8736, 8736]
          olderOffsets: [0, 0, 9648, 9648]
        - maximum: 90
          youngerOffsets: [0, 0, 8832, 8832]
          olderOffsets: [0, 0, 9744, 9744]
        - maximum: 90
          youngerOffsets: [0, 0, 8928, 8928]
          olderOffsets: [0, 0, 9792, 9792]
    reporting:
      kind: t5007
