    - [48000, 450, 0.25, 600]
    - [36000, 300, 0.06, 450]
    - [20000, 0, 0.06, 300]
salesTax: {rate: 0.13, label: "13% HST"}
propertyTax: {rate: 0.0076, city: Toronto}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
creditsUseRent: true
childBenefit:
  name: Ontario Child Benefit
  program: ontario-child-benefit
  params: {perChild: 1726.92, threshold: 26364, rate: 0.08}     # $143.91 a month
credits:
  - name: Ontario sales tax credit
    program: ontario-sales-tax-credit
    params: {perPerson: 371, rate: 0.04, thresholdSingle: 28506, thresholdFamily: 35632}
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit
    # CRA's 2025 calculation sheet: energy component up to 285; property tax component 71 + 10% of occupancy cost, up to 927
    params: {rentShare: 0.2, energyMax: 285, propertyBase: 71, propertyRate: 0.10, propertyMax: 927, rate: 0.02, thresholdSingle: 28506, thresholdFamily: 35632}
