code: ON
name: Ontario
order: 7
brackets:
  - [52886, 0.0505]
  - [105775, 0.0915]
  - [150000, 0.1116]
  - [220000, 0.1216]
  - [.inf, 0.1316]
basicPersonalAmount: 12747
dividendTaxCredit: {eligible: 0.10, nonEligible: 0.029863}
spouseAmount: {max: 10823, threshold: 1082}     # base amount 11,905 on Form ON428, maximum 10,823
# Surtax on Ontario tax after non-refundable credits, before the dividend tax credit (form ON428): [threshold, rate]
surtax: [[5710, 0.20], [7307, 0.36]]
ontarioTaxReduction: {base: 294, perChild: 544}
# LIFT credit is not indexed; the maximum, rate and thresholds are the same as in 2026
lift: {max: 875, rate: 0.0505, threshold: 32500, familyThreshold: 65000, phaseOut: 0.05}
payroll:
  # Ontario Health Premium (not indexed): [taxable income above, base, rate, cap], highest band first
  healthPremium:
    - [200000, 750, 0.25, 900]
    - [72000, 600, 0.25, 750]
    - [48000, 450, 0.25, 600]
    - [36000, 300, 0.06, 450]
    - [20000, 0, 0.06, 300]
salesTax: {rate: 0.13, label: "13% HST"}
propertyTax: {rate: 0.0076, city: Toronto, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
creditsUseRent: true
childBenefit:
  name: Ontario Child Benefit
  program: ontario-child-benefit
  params: {perChild: 1726.92, threshold: 26364, rate: 0.08}     # $143.91 a month
credits:
  - name: Ontario sales tax credit
    program: ontario-sales-tax-credit
    params: {perPerson: 371, rate: 0.04, thresholdSingle: 28506, thresholdFamily: 35632}
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit
    # CRA's 2025 calculation sheet: energy component up to 285; property tax component 71 + 10% of occupancy cost, up to 927
    params: {rentShare: 0.2, energyMax: 285, propertyBase: 71, propertyRate: 0.10, propertyMax: 927, rate: 0.02, thresholdSingle: 28506, thresholdFamily: 35632}
childcareCredit:
  name: Ontario CARE tax credit
  program: ontario-care
  # ON479-A: each income step or part thereof reduces the credit rate.
  params: {fullThrough: 20000, maxRate: 0.75, decrement: 0.02, steps: [[40000, 2500], [60000, 5000], [150000, 3600]]}
sources:
  - {label: "CRA ON479-A, Ontario CARE rate and income calculation", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-tca/5006-tca-25e.pdf"}
  - {label: "CRA, Form ON428 for 2025 (brackets, basic and spouse amounts, surtax, tax reduction, health premium)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-c/5006-c-25e.pdf"}
  - {label: "CRA, Ontario tax information for 2025", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/ontario/5006-pc.html"}
  - {label: "CRA, T4114 (Ontario child benefit, July 2025 to June 2026)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/t4114/t4114-25e.pdf"}
  - {label: "CRA, RC4210 (Ontario sales tax credit, 2025-2026)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pub/rc4210/rc4210-25e.txt"}
  - {label: "CRA, 2025 Ontario energy and property tax credit calculation sheet", url: "https://www.canada.ca/en/revenue-agency/services/child-family-benefits/provincial-territorial-programs/ontario-energy-property-tax-credit-oeptc-calculation-sheets/2025-ontario-energy-property-tax-credit-calculation-sheets/2025-ontario-energy-property-tax-credit-calculation-sheet-single-individuals-no-children.html"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate, carried over to 2025)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
    url: https://www150.statcan.gc.ca/n1/tbl/csv/25100060-eng.zip
  - label: "Carbon history: Natural Gas: A Primer"
    url: https://natural-resources.canada.ca/energy-sources/fossil-fuels/natural-gas-primer
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: Closed - Canada Carbon Rebate (CCR) for individuals"
    url: https://www.canada.ca/en/revenue-agency/services/child-family-benefits/canada-carbon-rebate/how-much.html
  - label: "Carbon history: Lowering energy bills for Canadians across the country"
    url: https://www.canada.ca/en/department-finance/news/2023/10/lowering-energy-bills-for-canadians-across-the-country.html

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 16200
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 58.86
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 58.2901 GJ gas and 1.0275 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 140
            spouse: 70
            child: 35
            firstChild: 70
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 151
            spouse: 75.5
            child: 37.75
            firstChild: 75.5
            threshold: [0, 0]
            rate: 0
