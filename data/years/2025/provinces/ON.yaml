code: ON
name: Ontario
order: 7
brackets:
  - [52886, 0.0505]
  - [105775, 0.0915]
  - [150000, 0.1116]
  - [220000, 0.1216]
  - [.inf, 0.1316]
basicPersonalAmount: 12747
dividendTaxCredit: {eligible: 0.10, nonEligible: 0.029863}
spouseAmount: {max: 10823, threshold: 1082}     # base amount 11,905 on Form ON428, maximum 10,823
# Surtax on Ontario tax after non-refundable credits, before the dividend tax credit (form ON428): [threshold, rate]
surtax: [[5710, 0.20], [7307, 0.36]]
ontarioTaxReduction: {base: 294, perChild: 544}
# LIFT credit is not indexed; the maximum, rate and thresholds are the same as in 2026
lift: {max: 875, rate: 0.0505, threshold: 32500, familyThreshold: 65000, phaseOut: 0.05}
payroll:
  # Ontario Health Premium (not indexed): [taxable income above, base, rate, cap], highest band first
  healthPremium:
    - [200000, 750, 0.25, 900]
    - [72000, 600, 0.25, 750]
    - [48000, 450, 0.25, 600]
    - [36000, 300, 0.06, 450]
    - [20000, 0, 0.06, 300]
salesTax: {rate: 0.13, label: "13% HST"}
propertyTax: {rate: 0.0076, city: Toronto, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
creditsUseRent: true
childBenefit:
  name: Ontario Child Benefit
  program: ontario-child-benefit
  params: {perChild: 1726.92, threshold: 26364, rate: 0.08}     # $143.91 a month
credits:
  - name: Ontario sales tax credit
    program: ontario-sales-tax-credit
    params: {perPerson: 371, rate: 0.04, thresholdSingle: 28506, thresholdFamily: 35632}
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit
    # CRA's 2025 calculation sheet: energy component up to 285; property tax component 71 + 10% of occupancy cost, up to 927
    params: {rentShare: 0.2, energyMax: 285, propertyBase: 71, propertyRate: 0.10, propertyMax: 927, rate: 0.02, thresholdSingle: 28506, thresholdFamily: 35632}
childcareCredit:
  name: Ontario CARE tax credit
  program: ontario-care
  # ON479-A: each income step or part thereof reduces the credit rate.
  params: {fullThrough: 20000, maxRate: 0.75, decrement: 0.02, steps: [[40000, 2500], [60000, 5000], [150000, 3600]]}
fuelTax: {gasoline: 0.09}   # $ per litre; unchanged since July 1, 2022; Toronto has no municipal fuel tax

