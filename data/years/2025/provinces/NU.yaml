childBenefit:
  name: Nunavut Child Benefit
  program: per-child-reduced
  # T4114 (2025 edition) prints "$29 per month" for the basic benefit, which would be $348 a year. The 2026 file uses
  # $696 (twice that), so $696 is kept here; it is the one child benefit figure that couldn't be matched to a
  # publication and needs a check against the CRA's Nunavut child benefit page.
  params: {perChild: 696, threshold: 22065, rateOneChild: 0.03, rateMoreChildren: 0.05}
  estimated: true   # per-child amount taken from the 2026 file, not matched to T4114 (see above)
