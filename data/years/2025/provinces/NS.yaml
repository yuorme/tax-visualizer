code: NS
name: Nova Scotia
order: 11
brackets:
  - [30507, 0.0879]
  - [61015, 0.1495]
  - [95883, 0.1667]
  - [154650, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: 11744      # a flat amount for everyone in 2025 (Form NS428)
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.015}
spouseAmount: {max: 11744, threshold: 874}     # Form NS428: base 12,618 less the greater of 874 and the spouse's income
claimants:
  childAmount: {claimant: lower-net-income, transfer: none}
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: false, order: after-foreign-tax-credit}
childAmount: {perChild: 1200, ages: under6}    # $100 a month
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
# The HST fell from 15% to 14% on April 1, 2025: 15% for three months and 14% for nine is a 14.25% year.
salesTax: {rate: 0.1425, label: "14% HST (15% before April 1)"}
propertyTax: {rate: 0.0061, city: Halifax, estimated: true}   # carried over from 2026 (estimated); not checked against 2025 municipal rates
childBenefit:
  name: Nova Scotia Child Benefit
  program: nova-scotia-child-benefit
  params: {perChild: 1524.96, fullBelow: 26000, partialBelow: 34000, partialOtherChildren: 762.48}   # $127.08 and $63.54 a month
credits:
  - name: Nova Scotia affordable living tax credit
    program: ns-affordable-living-tax-credit
    params: {base: 255, child: 60, rate: 0.05, threshold: 30000}
fuelTax: {gasoline: 0.155}   # $ per litre; the UARB price schedules show 15.5¢ on January 15, April 1 and September 12, 2025

