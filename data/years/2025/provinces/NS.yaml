# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 17400
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2025-01-01
      rate: 0.1761
    - from: 2025-04-01
      rate: 0
  heating:
    amount: 3.95
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 3.9143 GJ gas and 26.1393 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2025-01-01
            adult: 103
            spouse: 51.5
            child: 25.75
            firstChild: 51.5
            threshold: [0, 0]
            rate: 0
          - date: 2025-04-01
            adult: 110
            spouse: 55
            child: 27.5
            firstChild: 55
            threshold: [0, 0]
            rate: 0

seniorCredits:
  provisionalRules: false
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 5734, threshold: 30828, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1173}}
  transfer: schedule2-unused-base
  ageTaxCredit: {program: age-taxable-income-credit, params: {minimumAge: 65, threshold: 24000, amount: 1000}}

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: ns-gis-tax-refund
    name: Nova Scotia GIS tax refund
    params:
      minimumAge: 65
      minimum: 50
      maximum: 10000
    # No T5007 inclusion inferred from statutory tax-overpayment status; amount uses final assessed provincial tax.
    estimated: true
    reporting:
      kind: none
      exemptThrough: 0
