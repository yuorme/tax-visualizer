  - label: "CRA, Starting and stopping CPP deductions (age, employee elections and maximum proration)"
    url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/payroll/payroll-deductions-contributions/canada-pension-plan-cpp/starting-stopping-cpp-deductions.html
