# Federal parameters for the 2026 tax year.
# Benefit amounts (CCB, Groceries and Essentials Benefit) are for the July 2026 – June 2027 payment year,
# which is based on 2025 income; the calculator applies them to current-year income.
year: 2026

# [upper limit of bracket, rate]; .inf = no upper limit
brackets:
  - [58523, 0.14]
  - [117045, 0.205]
  - [181440, 0.26]
  - [258482, 0.29]
  - [.inf, 0.33]

# Basic personal amount: shrinks linearly from max to min between `from` and `to` (net income)
basicPersonalAmount: {max: 16452, min: 14829, from: 181440, to: 258482}

quebecAbatement: 0.165          # reduction of basic federal tax for Quebec residents
employmentAmount: 1501          # Canada employment amount
indexation: 0.02                # CRA's indexation factor for 2026; estimates below index 2025 figures by it

investment:
  capitalGainsInclusion: 0.5
  grossUp: {eligible: 1.38, nonEligible: 1.15}
  # Federal dividend tax credit, as a share of the grossed-up dividend
  dividendTaxCredit: {eligible: 0.150198, nonEligible: 0.090301}
  # Not used in the calculation (withholding is an input): the Canada–U.S. treaty rate on portfolio dividends
  # (Article X(2)(b)), and the share of foreign property income above which foreign tax is deducted, not
  # credited (Income Tax Act s. 20(11)). Quoted in the page notes.
  foreignWithholding: {usTreaty: 0.15, deductibleAbove: 0.15}
  # Not used in the calculation: starting values for the page's Portfolio view, and not published figures. Rounded from
  # Vanguard Balanced ETF Portfolio (VBAL) as at Sep 30 2026, cached in docs/verification/2026/sources/vanguard-vbal.txt:
  # underlying funds at lines 97-103 give Canadian stocks 18.08%, U.S. and international stocks 43.73% (27.98 + 11.05 +
  # 4.70) and bonds 38.16% (22.89 + 7.84 + 7.43), each rounded to the nearest 10 points; the 2.22% distribution yield at
  # line 248 is rounded to one decimal, one rate for the whole portfolio as the fund reports it.
  # This fund's date, not the tax year, is what they depend on, so the page reads the newest year that has them and
  # later years needn't repeat them. Changing them can't change a result: a used portfolio stores its own values.
  portfolioDefaults:
    canadian: 0.2
    foreign: 0.4
    bonds: 0.4
    yield: 0.022
    estimated: true
    basis: "Vanguard Balanced ETF Portfolio as at Sep 30 2026"
    source: {label: "Vanguard Canada, Vanguard Balanced ETF Portfolio (holdings and yield as at Sep 30 2026)", url: "https://www.vanguard.ca/en/product/etf/asset-allocation/9578/vanguard-balanced-etf-portfolio"}

rrsp: {rate: 0.18, limit: 33810}

# CRA T778 and folio S1-F3-C1 (2015 onward). Pool limits across ALL eligible children.
# T778 birth-year bands include children turning 16; DTC/infirm dependants can qualify when older.
# Benefit age bands preserve the existing full-year approximation, using detailed year-end ages when supplied.
childcare:
  program: federal-childcare
  params:
    youngUnder: 7
    eligibleThrough: 16
    annualYoung: 8000
    annualOther: 5000
    annualDisability: 11000
    earnedNumerator: 2
    earnedDenominator: 3
    benefitChildUnder: 18
    benefitYoungUnder: 6

payroll:
  # Employee retirement timing; CPP Schedule 8 prorates, QPP employee elections retain annual ceilings.
  # QPP annual settlement uses Schedule U's full personal exemption, separately from monthly withholding.
  employeeRetirement:
    cpp:
      program: cpp-employee-retirement
      # Annual settlement continues 2025 Schedule 8 with published 2026 payroll rates and ceilings.
      estimated: true
      params:
        contributionStartAge: 18
        electionFromAge: 65
        mandatoryStopAge: 70
        electionEffectiveMonthOffset: 1
        restartAfterCalendarYears: 1
    qpp:
      program: qpp-employee-retirement
      # Annual settlement continues 2025 Schedule U; 2026 employer timing and maxima are published.
      estimated: true
      params:
        contributionStartAge: 18
        electionFromAge: 65
        mandatoryStopAge: 72
        electionEffectiveMonthOffset: 1
        restartAfterCalendarYears: 1
        electionsFromYear: 2024
  # CPP: base contributions earn a credit; enhanced (first and second additional) contributions are deducted
  cpp: {exempt: 3500, ympe: 74600, yampe: 85000, base: 0.0495, enh1: 0.01, enh2: 0.04}
  qpp: {exempt: 3500, ympe: 74600, yampe: 85000, base: 0.053, enh1: 0.01, enh2: 0.04}
  ei: {maxInsurable: 68900, rate: 0.0163, quebecRate: 0.013}
  qpip: {maxInsurable: 103000, rate: 0.0043}

childBenefit:   # Canada Child Benefit, July 2026 – June 2027
  perChildUnder6: 8157
  perChild6to17: 6883
  threshold1: 38237
  threshold2: 82847
  # Indexed by number of children (index 0 unused; 4 = four or more)
  rate1: [0, 0.07, 0.135, 0.19, 0.23]
  fixed2: [0, 3123, 6022, 8476, 10260]
  rate2: [0, 0.032, 0.057, 0.08, 0.095]

groceriesBenefit:   # Canada Groceries and Essentials Benefit (formerly the GST/HST credit)
  name: Canada Groceries and Essentials Benefit   # RC4210, July 2026 – June 2027
  formerName: GST/HST credit                      # RC4210: "The CGEB replaces the ... GST/HST credit"
  adult: 445
  spouseOrFirstChild: 445
  child: 234
  singleSupplement: {max: 234, rate: 0.02, from: 11564}
  phaseOut: {rate: 0.05, from: 46432}

workersBenefit:   # Canada Workers Benefit, basic amount (no disability supplement)
  estimated: true   # 2025 figures indexed by 2% until CRA publishes 2026 values
  standard: {max: [1665, 2869], rate: 0.27, floor: [3000, 3000], threshold: [27392, 31251], phaseOut: [0.15, 0.15]}
  secondaryEarnerExemption: 16714
  # Provinces with their own version under an agreement with Ottawa. [single, family] pairs.
  regional:
    AB: {max: [1785, 2671], rate: 0.21, floor: [2760, 2760], threshold: [26682, 33427], phaseOut: [0.15, 0.15]}
    NU: {max: [1653, 2484], rate: 0.14, floor: [6000, 6000], threshold: [27369, 37666], phaseOut: [0.04, 0.08]}
  # Quebec's version follows its work premium: [phase-in rate, excluded income, income at max, phase-out base]
  quebec:
    phaseOutRate: 0.20
    single: [0.373, 2400, 12808, 14453]
    couple: [0.373, 3600, 19828, 22223]
    parent: [0.20, 2400, 12808, 14612]
    coupleKids: [0.239, 3600, 19828, 22424]

# Federal excise tax on gasoline, $ per litre: 10¢, suspended (0¢) from April 20, 2026. The suspension was to end
# September 7; on September 2 it was extended to January 31, 2027 (half rate February 1 to March 31, 2027), so 0¢
# runs to the end of 2026.
fuelTax:
  gasoline:
    - {from: "2026-01-01", rate: 0.10}
    - {from: "2026-04-20", rate: 0, note: "suspended to January 31, 2027"}

# Starting values for the driving inputs. Each province sets its own distance (see provinces/<XX>.yaml).
driving:
  # Not a published figure: NRCan's 2023 on-road averages for gasoline vehicles (cars 7.7 and light trucks 10.0 L/100 km),
  # weighted by each type's distance driven (stock × average distance: 9.871 million cars × 13,261 km and 11.506 million
  # light trucks × 15,180 km), give 9.02 L/100 km, rounded to 9.0.
  efficiency: 9.0
  efficiencySource: "Natural Resources Canada's 2023 on-road average for gasoline cars and light trucks, weighted by how far each type is driven"
  distanceSource: "2009 Canadian Vehicle Survey"
  estimated: true

