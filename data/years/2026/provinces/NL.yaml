code: NL
name: Newfoundland and Labrador
order: 12
brackets:
  - [44678, 0.087]
  - [89354, 0.145]
  - [159528, 0.158]
  - [223340, 0.178]
  - [285319, 0.198]
  - [570638, 0.208]
  - [1141275, 0.213]
  - [.inf, 0.218]
basicPersonalAmount: 13094
basicPersonalAmountChange: {change: April 2026 budget increase, effective: "January 1, 2026"}
dividendTaxCredit: {eligible: 0.063, nonEligible: 0.032}
spouseAmount: {max: 9142, threshold: 915}
# Provisional continuation of the verified 2025 return rules pending 2026 CRA forms.
claimants:
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: true, order: after-foreign-tax-credit, estimated: true}
lowIncomeReduction:
  program: nl-low-income-reduction
  params: {individual: 842, family: 563, rate: 0.16, thresholdIndividual: 24191, thresholdFamily: 40905}
  estimated: true   # family threshold is 2025's indexed by 2%
salesTax: {rate: 0.15, label: "15% HST"}
propertyTax: {rate: 0.0091, city: "St. John's"}
# NRCan also lists a Provincial Clean Fuels Adjuster here (3.74¢ a litre on gasoline): an allowance that
# the Public Utilities Board builds into the regulated pump price to pass on suppliers' cost of the federal
# Clean Fuel Regulations. It isn't a tax paid to government, so it isn't counted.
# Fuel tax on gasoline, $ per litre. 7.5¢ (the 14.5¢ rate less the 7¢ cut, made permanent in March 2026), then 0¢
# from December 1, 2026 to March 31, 2027, announced October 26, 2026 with legislation to follow.
fuelTax:
  gasoline:
    - {from: "2026-01-01", rate: 0.075}
    - {from: "2026-12-01", rate: 0, note: "announced October 26, 2026, legislation pending"}
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 4,367.6 million
# vehicle-km ÷ 290,098 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 15100, estimated: true}
childBenefit:
  name: NL Child Benefit
  program: nl-child-benefit
  params: {perChild: [1888, 2002, 2150, 2310], fullUpTo: 20397, endsAt: 38193}   # 1st, 2nd, 3rd, each later child
  estimated: true   # straight-line taper between the published start and end incomes
credits:
  - name: NL income supplement
    program: nl-income-supplement
    params: {base: 254, extraMax: 266, extraRate: 0.0532, extraFrom: 15000, couple: 69, child: 231, rate: 0.09, threshold: 40000}
childcareCredit:
  name: Newfoundland and Labrador child care amount
  program: nl-childcare
  # NL428 line 58320 equals federal line 21400, converted at the first provincial bracket rate.
  params: {}
