code: BC
name: British Columbia
order: 0          # position in the west-to-east sort
brackets:
  - [50363, 0.056]
  - [100728, 0.077]
  - [115648, 0.105]
  - [140430, 0.1229]
  - [190405, 0.147]
  - [265545, 0.168]
  - [.inf, 0.205]
basicPersonalAmount: 13216
dividendTaxCredit: {eligible: 0.12, nonEligible: 0.0196}
spouseAmount: {max: 11317, threshold: 1132}
bcTaxReduction: {max: 690, rate: 0.0356, threshold: 25570}
salesTax: {rate: 0.12, label: "5% GST + 7% PST"}
propertyTax: {rate: 0.0030, city: Vancouver}
# Fuel tax on gasoline, $ per litre, in the Vancouver area: 27¢ motor fuel tax, of which 1.75¢ general revenue and
# 6.75¢ BCTFA (the provincial 8.5¢) and 18.5¢ TransLink. B.C.'s carbon tax ended April 1, 2025.
fuelTax:
  gasoline: 0.085
  area: Vancouver area
  regional: {name: TransLink, gasoline: 0.185}
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 33,310.1 million
# vehicle-km ÷ 2,583,861 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 12900, estimated: true}
creditsUseRent: true
childBenefit:
  name: B.C. family benefit
  program: bc-family-benefit
  params: {max: [1750, 1100, 900], min: [775, 750, 725], singleParent: 500, rate: 0.04, threshold: 30176, minThreshold: 96562}
credits:
  - name: B.C. renter's tax credit
    program: bc-renters-tax-credit
    params: {max: 400, rate: 0.02, threshold: 66189}
# Property-tax relief (#22, #223), 2026 only. Derivations and limits: docs/verification/22-property-tax-relief.md.
propertyRelief:
  - name: B.C. home owner grant
    program: bc-home-owner-grant
    scope: provincial
    estimated: true   # the entered home value stands in for the assessed value; any household member 65+ selects the senior schedule
    params:
      seniorAge: 65
      standard: {ordinary: 570, senior: 845}          # Schedules 1 and 2: Metro Vancouver, Capital and Fraser Valley regions
      northernRural: {ordinary: 770, senior: 1045}    # Schedules 3 and 4
      minimumRemaining: {ordinary: 350, senior: 100}  # the schedule's "property taxes minus" amount below the full grant
      valueThreshold: 2075000                         # 2026 threshold, B.C. Reg. 100/2002 s.22 and the 2026 news release
      reductionPerThousand: 5                         # Act s.2(3), applied after the schedule
  - name: B.C. low-income grant supplement
    program: bc-low-income-grant-supplement
    scope: provincial
    estimated: true   # current-year net income stands in for the previous year's (#21 decision); child-care and disability deductions omitted
    params:
      seniorAge: 65
      fullIncomeLimit: 30000   # B.C. Reg. 100/2002 s.16: adjusted net income up to this restores the whole reduction
      halfIncomeLimit: 32000   # s.17: over the first limit and up to this restores half
      halfShare: 0.5
      minimumPayable: 25       # s.18
      deductions: {partner: 3000, perSenior: 3000, perChild: 3000}   # s.11(2)-(3), before the child-care reduction
sources:
  - {label: "B.C. Home Owner Grant Act, s.2 and Schedules 1-4", url: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/96194_01"}
  - {label: "B.C. Home Owner Grant Regulation, ss.11 and 16-18 (B.C. Reg. 100/2002)", url: "https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/100_2002"}
  - {label: "B.C. Government news release: Home Owner Grant threshold, 2026 (amounts unchanged)", url: "https://news.gov.bc.ca/releases/2025FIN0049-001293"}
  - {label: "Province of B.C., Low income grant supplement for seniors", url: "https://www2.gov.bc.ca/gov/content/taxes/property-taxes/annual-property-tax/home-owner-grant/senior/low-income"}
  - {label: "Social assistance payments – Personal income tax", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-145-social-assistance-payments.html"}
  - label: Senior’s Supplement
    url: https://www2.gov.bc.ca/gov/content/governments/policies-for-government/bcea-policy-and-procedure-manual/supports-for-seniors/seniors-supplement
  - label: "Updated: October 1, 2026"
    url: https://www2.gov.bc.ca/assets/gov/british-columbians-our-governments/policies-for-government/bc-employment-assistance-policy-procedure-manual/additional-resources/sensuppratesincomemaritalstatus.pdf
  - label: Microsoft Word - T5007-2026 information for staff - external - Final Approved.docx
    url: https://www2.gov.bc.ca/assets/gov/british-columbians-our-governments/policies-for-government/bc-employment-assistance-policy-procedure-manual/additional-resources/t5007-info.pdf
  - label: Guide T5007 – Return of Benefits
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/t4115/guide-t5007-return-benefits.html
  - {"label": "British Columbia Tax", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-c/5010-c-25e.pdf"}
  - {"label": "Provincial Amounts Transferred from your Spouse or Common-Law Partner", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-s2/5010-s2-25e.pdf"}
  - {"label": "Worksheet BC428", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-d/5010-d-25e.pdf"}
  - {"label": "2026 British Columbia  Personal Tax Credits Return", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/td1bc/td1bc-26e.pdf"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - {label: "B.C. Ministry of Finance, Motor fuel tax and carbon tax rates on fuels and substances", url: "https://www2.gov.bc.ca/gov/content/taxes/sales-taxes/motor-fuel-carbon-tax/publications/motor-fuel-tax-and-carbon-tax-rates"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}

seniorCredits:
  # Published 2026 amounts; filing formulas/transfer ordering provisionally continue 2025.
  provisionalRules: true
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 5927, threshold: 44119, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1000}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: bc-senior-supplement
    name: BC Senior's Supplement
    params:
      single: 99.3
      couple: 110.25
      allowance: 99.83
      allowanceProtection: 100
      minimum: 1
    # Allowance protection $100 is inferred from published mixed-couple rows; continue ordinary receipt from first GIS month.
    estimated: true
    reporting:
      kind: t5007
      exemptThrough: 500
