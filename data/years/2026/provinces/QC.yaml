code: QC
name: Quebec
order: 8
system: quebec     # Quebec runs its own income tax, QPP and QPIP
brackets:
  - [54345, 0.14]
  - [108680, 0.19]
  - [132245, 0.24]
  - [.inf, 0.2575]
basicPersonalAmount: 18952
dividendTaxCredit: {eligible: 0.117, nonEligible: 0.0342}
spouseAmount: transfer     # either spouse's unused credits, including BPA and dividends, transfer through line 431
healthServicesFund:
  name: Quebec Health Services Fund
  program: qc-health-services-fund
  # Finances Québec Table 3 verifies the 1% rate and both 2026 thresholds.
  # Caps (150/1000), the second-column base (150) and Part A rules continue 2025 Schedule F;
  # not independently verified against a published 2026 Schedule F.
  estimated: true
  params: {threshold: 18500, upperThreshold: 64355, rate: 0.01, firstCap: 150, max: 1000}
quebec:
  workerDeduction: {rate: 0.06, max: 1450}
  # Published 2026 amounts; line 275 income base provisionally continues 2025 Schedule B.
  # The 2026 Schedule B is not yet available; see docs/verification/188-qc-living-alone.md.
  livingAlone: {max: 2172, rate: 0.1875, threshold: 42955, estimated: true}
salesTax: {rate: 0.14975, label: "5% GST + 9.975% QST"}
propertyTax: {rate: 0.0090, city: Montreal, note: school tax may be extra}
# Fuel tax on gasoline, $ per litre: Quebec's 19.2¢, plus the 3¢ ARTM tax in the Montreal region. Quebec's
# cap-and-trade cost in the pump price isn't a tax and isn't counted.
fuelTax:
  gasoline: 0.192
  regional: {name: ARTM, gasoline: 0.03}   # Autorité régionale de transport métropolitain, budget 2026
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 68,133.1 million
# vehicle-km ÷ 4,593,169 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 14800, estimated: true}
childBenefit:
  name: Family allowance
  program: quebec-family-allowance
  params: {max: 3068, maxSingleParent: 1077, min: 1221, minSingleParent: 430, rate: 0.04, thresholdSingle: 44032, thresholdCouple: 60398, schoolSupplies: 127}
credits:
  - name: Solidarity tax credit
    program: quebec-solidarity-tax-credit
    params: {qstAdult: 363, qstSpouse: 363, qstAlone: 172, housingCouple: 906, housingSingle: 746, child: 158, rate: 0.06, threshold: 43195}
  - name: Work premium
    program: quebec-work-premium
    params:
      phaseOutRate: 0.10
      single: [0.116, 2400, 12808]        # [rate, excluded income, reduction threshold]
      couple: [0.116, 3600, 19828]
      parent: [0.30, 2400, 12808]
      coupleKids: [0.25, 3600, 19828]
childcareCredit:
  name: Quebec childcare expenses tax credit
  program: quebec-childcare
  # Year-end ages reflect under 16 during 2025 / under 14 during 2026; older infirm dependants remain eligible.
  params:
    youngUnder: 7
    eligibleThrough: 14
    annualYoung: 12525
    annualOther: 6305
    annualSevere: 17145
    rates: [[25305, 0.78], [44620, 0.75], [46270, 0.74], [47935, 0.73], [49565, 0.72], [51225, 0.71], [122290, 0.7], [.inf, 0.67]]
sources:
  - {"label": "Schedule B – Tax Relief Measures", "url": "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.B-V(2025-12).pdf"}
  - {"label": "GUIDE – INCOME TAX RETURN – 2025", "url": "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.G-V(2025-12).pdf"}
  - {"label": "Income Tax Return", "url": "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D-V(2025-12).pdf"}
  - {"label": "Parameters of the Personal Income Tax System for 2026", "url": "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/finances/publications-adm/parametres/AUTEN_IncomeTax2026.pdf"}
  - {label: "Revenu Québec, 2025 Schedule B (line 275 income base provisionally continued in 2026)", url: "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.B-V(2025-12).pdf"}
  - {label: "Finances Québec, 2026 parameters, Table 3 (1% Health Services Fund contribution and thresholds)", url: "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/finances/publications-adm/parametres/AUTEN_IncomeTax2026.pdf"}
  - {label: "Revenu Québec, 2025 Schedule F (caps and income rules provisionally continued in 2026)", url: "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.F-V(2025-12).pdf"}
  - {label: "Revenu Quebec, new childcare age limit in 2026", url: "https://www.revenuquebec.ca/en/press-room/tax-news/details/2025-09-23/new-age-limit-for-the-refundable-tax-credit-for-childcare-expenses/"}
  - {label: "Revenu Quebec, Schedule C pooled expenses and family income", url: "https://www.revenuquebec.ca/documents/en/formulaires/tp/2025-12/TP-1.D.C-V%282025-12%29.pdf"}
  - {label: "Finances Quebec, 2025 and 2026 childcare expense limits and income rates, Tables 3 and 5", url: "https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/finances/publications-adm/parametres/AUTEN_IncomeTax2026.pdf"}
  - {label: "Revenu Québec, 2026 tax rates", url: "https://www.revenuquebec.ca/en/citizens/income-tax-return/completing-your-income-tax-return/income-tax-rates/"}
  - {label: "CGTSIM, Understanding school tax (Montreal school tax is billed separately by the CGTSIM)", url: "https://www.cgtsim.qc.ca/en/understanding-school-tax/"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - {label: "ARTM, Budget 2026 (ARTM gasoline tax: $0.03 a litre in its territory)", url: "https://www.artm.quebec/wp-content/uploads/2025/12/RP_Budget_2026.pdf"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}

seniorCredits:
  program: quebec-age-living-alone-retirement-pool
  # Domestic retained line 122 receipts only; no additional adult-student single-parent amount.
  # 2026 formulas provisionally continue 2025 Schedule B and line 431.
  provisionalRules: true
  params: {minimumAge: 65, ageAmount: 3986, retirementMaximum: 3541, retirementMultiplier: 1.25, livingAlone: 2172, familyThreshold: 42955, reductionRate: 0.1875, creditRate: 0.14}
