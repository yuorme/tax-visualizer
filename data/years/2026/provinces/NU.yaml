code: NU
name: Nunavut
territory: true
order: 6
brackets:
  - [55801, 0.04]
  - [111602, 0.07]
  - [181439, 0.09]
  - [.inf, 0.115]
basicPersonalAmount: 19659
dividendTaxCredit: {eligible: 0.0551, nonEligible: 0.0261}
spouseAmount: {max: 19659, threshold: 0}
# Provisional continuation of the verified 2025 return rules pending 2026 CRA forms.
claimants:
  childAmount: {claimant: lower-net-income, transfer: schedule-2, estimated: true}
childAmount: {perChild: 1200, ages: under6}
payroll: {employeeTax: 0.02}
salesTax: {rate: 0.05, label: "5% GST"}
propertyTax: {rate: 0.0100, city: "Iqaluit (est.)", estimated: true, rough: true}   # no published rate used: a rough placeholder
fuelTax: {gasoline: 0.064}   # $ per litre
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 26.3 million
# vehicle-km ÷ 3,858 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 6800, estimated: true}
childBenefit:
  name: Nunavut Child Benefit
  program: per-child-reduced
  params: {perChild: 696, threshold: 22065, rateOneChild: 0.03, rateMoreChildren: 0.05}
  rateSource: its 2026 Bill 4   # T4114 gives the amounts and threshold, not the reduction rates
sources:
  - {label: "Guide T5007 – Return of Benefits", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/t4115/guide-t5007-return-benefits.html"}
  - {label: "Social assistance payments – Personal income tax", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-145-social-assistance-payments.html"}
  - {label: "Statement of Benefits T5007", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/tax-slips/statement-benefits-t5007.html"}
  - label: Minister’s 2023 - 2024 Report on Poverty Reduction
    url: https://www.assembly.nu.ca/sites/default/files/2025-02/TD-360-6%282%29-EN-Minister%E2%80%99s%202023-2024%20Report%20on%20Poverty%20Reduction.pdf
  - {"label": "Nunavut Tax", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5014-c/5014-c-25e.pdf"}
  - {"label": "Territorial Amounts Transferred from your Spouse or Common-Law Partner", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5014-s2/5014-s2-25e.pdf"}
  - {"label": "Worksheet NU428", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5014-d/5014-d-25e.pdf"}
  - {"label": "2026 Nunavut Personal Tax Credits Return", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/td1nu/td1nu-26e.pdf"}
  - {label: "CRA NU 2025 guide, claimant and transfer rules", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/nunavut/5014-pc.html"}
  - {label: "CRA NU(S2) 2025, shared unused-base calculation, lines 6–13", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5014-s2/5014-s2-25e.pdf"}
  - {label: "Legislative Assembly of Nunavut, Bill 4 (2026), Income Tax Act amendments (child benefit reduction rates)", url: "https://assembly.nu.ca/sites/default/files/2026-05/Bill_4_AATA_Income_Tax_Act_EF.pdf"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}

seniorCredits:
  # Published 2026 amounts; filing formulas/transfer ordering provisionally continue 2025.
  provisionalRules: true
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 12550, threshold: 46432, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 2000}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: territorial-senior-supplement
    name: Nunavut Senior Citizen Supplementary Benefit
    params:
      monthly: 300
    # Nunavut $300 continues the dated administrative annual-report rate; the authorizing amendment remains unlocated.
    estimated: true
    reporting:
      kind: t5007
      exemptThrough: 0
