code: MB
name: Manitoba
order: 5
bracketsFrozenSince: 2025   # Manitoba's 2025 and 2026 budgets keep the limits unindexed
brackets:
  - [47000, 0.108]
  - [100000, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: {max: 15780, min: 0, from: 200000, to: 400000}
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
familyTaxBenefit:
  program: mb-family-tax-benefit
  claimant: higher-net-income
  # Interpretation, not a stated statutory rule: s. 4.6(16.2)(a) is silent on equal incomes.
  # Following #92, allow either spouse's whole child claim and choose the least household tax.
  tie: household-minimum
  # TD1MB-WS publishes the amounts and 9% taper. Age/eligibility and MB428 ordering continue 2025 filing rules;
  # 2026 return forms are not yet published. The TD1 worksheet's "born in 2004" is not a verified filing cutoff.
  # Act s. 4.6(16.1)(b) requires eligible-individual status at any time; assume it existed before age 18.
  estimated: true
  params: {basic: 2065, dependant: 2065, child: 2752, reductionRate: 0.09, childThrough: 18}
salesTax: {rate: 0.12, label: "5% GST + 7% RST"}
propertyTax: {rate: 0.0138, city: Winnipeg}
fuelTax: {gasoline: 0.125}   # $ per litre
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 10,027.3 million
# vehicle-km ÷ 670,133 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 15000, estimated: true}
creditsUseRent: true
credits:
  - name: Homeowners affordability tax credit
    nameRenter: Renters affordability tax credit
    program: mb-affordability-credits
    params:
      homeownerMax: 1600   # not indexed: fixed 2026 maximum; Budget 2026's $1,700 starts in tax year 2027
      renter: 625
    estimated: true   # renters credit taken at its maximum
    # Superseded for 2026 by propertyRelief below: the engine skips this entry when the school-tax programs are declared,
    # so the two never both apply. It stays only for the page's prose until #227.
# Property-tax relief (#22, #223), 2026 only. Derivations and limits: docs/verification/22-property-tax-relief.md.
# Order matters: the rebate reads the homeowners credit line before it.
propertyRelief:
  - name: Homeowners affordability tax credit
    program: mb-homeowners-school-tax-credit
    scope: provincial
    estimated: true   # a default-city bill's school tax is estimated from the reference division's mills and the home value
    params:
      max: 1600   # fixed 2026 maximum; Budget 2026's $1,700 starts in tax year 2027
      # Winnipeg School Division No. 1: school tax = assessed value x portion x mills / 1,000. Residential provincial ESL is 0.
      reference: {assessmentPortion: 0.45, schoolMills: 15.994}
  - name: Seniors school tax rebate
    program: mb-senior-school-tax-rebate
    scope: provincial
    estimated: true   # on a default-city bill it reads the estimated school tax
    params: {seniorAge: 65, max: 235, rate: 0.01, threshold: 40000}   # MB479 lines 38-44; nil at family income 63,500
  - name: Renters affordability tax credit
    program: mb-renters-affordability-senior
    scope: provincial
    params: {seniorAge: 65, ordinary: 625, seniorMax: 982.14, topUpMax: 357.14, rate: 0.008929}   # S.M. 2025 c.48 ss.21, 52(7)
sources:
  - {label: "City of Winnipeg, 2026 combined mill rates by school division (Winnipeg SD No. 1: 15.994)", url: "https://assessment.winnipeg.ca/Asmttax/pdfs/rates/CombinedMillRates.pdf"}
