code: MB
name: Manitoba
order: 5
bracketsFrozenSince: 2025   # Manitoba's 2025 and 2026 budgets keep the limits unindexed
brackets:
  - [47000, 0.108]
  - [100000, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: {max: 15780, min: 0, from: 200000, to: 400000}
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
familyTaxBenefit:
  program: mb-family-tax-benefit
  claimant: higher-net-income
  # Interpretation, not a stated statutory rule: s. 4.6(16.2)(a) is silent on equal incomes.
  # Following #92, allow either spouse's whole child claim and choose the least household tax.
  tie: household-minimum
  # TD1MB-WS publishes the amounts and 9% taper. Age/eligibility and MB428 ordering continue 2025 filing rules;
  # 2026 return forms are not yet published. The TD1 worksheet's "born in 2004" is not a verified filing cutoff.
  # Act s. 4.6(16.1)(b) requires eligible-individual status at any time; assume it existed before age 18.
  estimated: true
  params: {basic: 2065, dependant: 2065, child: 2752, reductionRate: 0.09, childThrough: 18}
salesTax: {rate: 0.12, label: "5% GST + 7% RST"}
propertyTax: {rate: 0.0138, city: Winnipeg}
fuelTax: {gasoline: 0.125}   # $ per litre
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 10,027.3 million
# vehicle-km ÷ 670,133 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 15000, estimated: true}
creditsUseRent: true
credits:
  - name: Homeowners affordability tax credit
    nameRenter: Renters affordability tax credit
    program: mb-affordability-credits
    params:
      homeownerMax: 1600   # not indexed: fixed 2026 maximum; Budget 2026's $1,700 starts in tax year 2027
      renter: 625
    estimated: true   # renters credit taken at its maximum
sources:
  - {label: "Manitoba Finance, Budget 2026 taxation bulletin (2026 homeowner maximum $1,600; $1,700 starts in 2027)", url: "https://www.gov.mb.ca/finance/taxation/pubs/bulletins/2026budget.pdf"}
  - {label: "Manitoba Income Tax Act, s. 4.6(16.1)–(16.2) (family benefit eligibility and claimant limits)", url: "https://web2.gov.mb.ca/laws/statutes/ccsm/_pdf.php?cap=i10"}
  - {label: "CRA, 2026 TD1MB (family tax benefit line 12)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/td1mb/td1mb-26e.pdf"}
  - {label: "CRA, 2026 TD1MB-WS (family benefit amounts and individual 9% taper)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/td1mb-ws/td1mb-ws-26e.pdf"}
  - {label: "CRA, T4127 January 2026 (Manitoba credit rate and frozen brackets)", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/payroll/t4127-payroll-deductions-formulas/t4127-jan/t4127-jan-payroll-deductions-formulas-computer-programs.html"}
  - {label: "CRA, 2025 MB428-A (provisional continuation of filing rules)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-a/5007-a-25e.pdf"}
  - {label: "CRA, 2025 MB428 (provisional continuation of credit ordering)", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-c/5007-c-25e.pdf"}
  - {label: "CRA, 2025 Manitoba guide (provisional continuation of claimant restrictions)", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/manitoba/5007-pc.html"}
  - {label: "Manitoba Finance, Personal income taxes (bracket indexation paused from the 2025 tax year)", url: "https://www.gov.mb.ca/finance/personal/ptaxes.html"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}
