code: PE
name: Prince Edward Island
shortName: PEI
order: 10
brackets:
  - [33928, 0.095]
  - [65820, 0.1347]
  - [106890, 0.166]
  - [142520, 0.1762]
  - [200000, 0.19]
  - [.inf, 0.20]
basicPersonalAmount: 15000
dividendTaxCredit: {eligible: 0.105, nonEligible: 0.013}
spouseAmount: {max: 12740, threshold: 1274}
# Provisional continuation of the verified 2025 return rules pending 2026 CRA forms.
claimants:
  childAmount: {claimant: lower-net-income, transfer: none, estimated: true}
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: true, order: before-foreign-tax-credit, estimated: true}
# Provisional 2025 amount/rules continued pending 2026 return forms; annualized as for NS.
# Birthdays/residence changes within the year are not prorated; see verification/162-pei-young-children.md.
childAmount: {perChild: 1200, ages: under6, estimated: true}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 350, spouse: 350, child: 300, rate: 0.05, threshold: 23000}
salesTax: {rate: 0.15, label: "15% HST"}
# 0.67% municipal + (1.70% provincial - 0.70% resident credit); additional owner credits need history.
# See docs/verification/86-charlottetown-owner-credit.md; the annual-bill override can reflect owner credits.
propertyTax: {rate: 0.0167, city: Charlottetown}
# NRCan also lists a Provincial Clean Fuels Adjuster here (4.0¢ a litre on gasoline): an allowance that
# IRAC builds into the regulated pump price to pass on suppliers' cost of the federal
# Clean Fuel Regulations. It isn't a tax paid to government, so it isn't counted.
# Fuel tax on gasoline, $ per litre: 8.47¢, suspended (0¢) from September 26, 2026 to January 31, 2027.
fuelTax:
  gasoline:
    - {from: "2026-01-01", rate: 0.0847}
    - {from: "2026-09-26", rate: 0, note: "suspended to January 31, 2027"}
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 1,229.9 million
# vehicle-km ÷ 81,499 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 15100, estimated: true}
childBenefit:
  name: PEI Child Benefit
  program: income-band-per-child
  params:
    bands: [[45000, 410], [80000, 290]]    # [family net income below, amount per child]
credits:
  - name: PEI essentials benefit
    program: pei-essentials-benefit
    params: {single: 310, family: 365, rate: 0.01, threshold: 95000, minimum: 175}
sources:
  - {label: "CRA PE428 2025, line 58230 young-child base; provisional 2026 continuation", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.pdf"}
  - {label: "CRA PE(S2) 2025, no young-child transfer; provisional 2026 continuation", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-s2/5002-s2-25e.pdf"}
  - {label: "CRA PE 2025 guide, claimant and transfer rules", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/prince-edward-island/5002-pc.html"}
  - {label: "CRA PE428 2025, reduction before FTC (87–89), unused balance before FTC (99–101); provisional 2026 continuation", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-25e.pdf"}
  - {label: "CRA T2036 2025, line 5 credit cap and note 4 tax otherwise payable; provisional 2026 continuation", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/t2036/t2036-25e.pdf"}
  - {label: "WOWA, Charlottetown property tax (2026 municipal component: 0.67%; not verified against an official municipal publication)", url: "https://wowa.ca/taxes/charlottetown-property-tax"}
  - {label: "PEI Real Property Tax Act, ss. 4 and 5 (May 2026 consolidation; provincial levy and resident credit)", url: "https://www.princeedwardisland.ca/sites/default/files/6e87/R-05-Real%20Property%20Tax%20Act.pdf"}
  - {label: "Town of Stratford, municipal rates (2025 provincial levy 1.50% and resident credit 0.50%)", url: "https://townofstratford.ca/about-stratford/municipal-tax-rates/"}
  - {label: "PEI Property Taxes and Charges (current non-commercial provincial levy 1.70% and resident credit 0.70%)", url: "https://www.princeedwardisland.ca/en/information/finance-and-affordability/property-taxes-and-charges"}
  - {label: "Island Regulatory and Appeals Commission, Temporary Suspension of Provincial Tax on Gasoline and Diesel (September 25, 2026)", url: "https://irac.pe.ca/wp-content/uploads/Notice-Removal-of-Provincial-Tax-September-25-2026.pdf"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}
