code: ON
name: Ontario
order: 7
brackets:
  - [53891, 0.0505]
  - [107785, 0.0915]
  - [150000, 0.1116]
  - [220000, 0.1216]
  - [.inf, 0.1316]
basicPersonalAmount: 12989
dividendTaxCredit: {eligible: 0.10, nonEligible: 0.029863}
spouseAmount: {max: 11029, threshold: 1103}
# Surtax on Ontario tax after non-refundable credits, before the dividend tax credit (form ON428): [threshold, rate]
surtax: [[5818, 0.20], [7446, 0.36]]
ontarioTaxReduction: {base: 300, perChild: 554}
lift: {max: 875, rate: 0.0505, threshold: 32500, familyThreshold: 65000, phaseOut: 0.05}
payroll:
  # Ontario Health Premium (not indexed): [taxable income above, base, rate, cap], highest band first
  healthPremium:
    - [200000, 750, 0.25, 900]
    - [72000, 600, 0.25, 750]
    - [48000, 450, 0.25, 600]
    - [36000, 300, 0.06, 450]
    - [20000, 0, 0.06, 300]
salesTax: {rate: 0.13, label: "13% HST"}
propertyTax: {rate: 0.0076, city: Toronto}
fuelTax: {gasoline: 0.09}   # $ per litre; Toronto has no municipal fuel tax
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 116,076.7 million
# vehicle-km ÷ 7,166,834 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 16200, estimated: true}
creditsUseRent: true
childBenefit:
  name: Ontario Child Benefit
  program: ontario-child-benefit
  params: {perChild: 1760, threshold: 26865, rate: 0.08}
credits:
  - name: Ontario sales tax credit
    program: ontario-sales-tax-credit
    params: {perPerson: 378, rate: 0.04, thresholdSingle: 29047, thresholdFamily: 36309}
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit
    params: {rentShare: 0.2, energyMax: 290, propertyBase: 73, propertyRate: 0.10, propertyMax: 944, rate: 0.02, thresholdSingle: 29047, thresholdFamily: 36309}
# Property-tax relief (#22, #224), 2026 only. Derivations and limits: docs/verification/22-property-tax-relief.md.
propertyRelief:
  - name: Ontario senior homeowners' property tax grant
    program: ontario-senior-homeowners-property-grant
    scope: provincial
    estimated: true   # the 2026 benefit uses 2025 income and property tax paid; this year's stand in for them
    params:
      ageAtPriorYearEnd: 64          # 64 on December 31, 2025, so 65 on December 31, 2026
      maximum: 500
      rate: 0.0333                   # of adjusted family net income over the threshold
      threshold: {single: 35000, couple: 45000}
      cutoff: {single: 50000, couple: 60000}   # no entitlement at or above these
  - name: Ontario energy and property tax credit
    program: ontario-energy-property-tax-credit-senior-overlap
    scope: provincial
    estimated: true   # same prior-year proxies; replaces the ordinary credit for a senior household (single without a child, or a couple)
    params:
      ageAtPriorYearEnd: 64
      rentShare: 0.2
      energyMax: 290
      propertyBase: 617              # senior property component: 617 plus the lesser of 10% of occupancy cost and 581
      propertyRate: 0.10
      propertyMax: 581
      rate: 0.02
      thresholdSingle: 36309         # single senior sheet
      thresholdFamily: 43571         # married or common-law senior sheet
childcareCredit:
  name: Ontario CARE tax credit
  program: ontario-care
  # 2026 continuation of Taxation Act s.103.0.2; 2026 budget confirms CARE, return form not yet available.
  estimated: true
  params: {fullThrough: 20000, maxRate: 0.75, decrement: 0.02, steps: [[40000, 2500], [60000, 5000], [150000, 3600]]}
