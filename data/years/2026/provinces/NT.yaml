driving: {distance: 11000, estimated: true}
childBenefit:
  name: NWT Child Benefit
  program: nwt-child-benefit-age-groups
  params:
    # Exact annual amounts from NWT Finance; count each age group separately.
    # T4114-26 confirms continuity for July 2026 to June 2027; apply to current-year income.
    under6: [0, 815, 1467, 1997, 2445]
    under6More: 367
    over6: [0, 652, 1174, 1597, 1956]
    over6More: 293
    fullUpTo: 30000
    endsAt: 80000
