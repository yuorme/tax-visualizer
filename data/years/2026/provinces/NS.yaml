code: NS
name: Nova Scotia
order: 11
brackets:
  - [30995, 0.0879]
  - [61991, 0.1495]
  - [97417, 0.1667]
  - [157124, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: 11932
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.015}
spouseAmount: {max: 11932, threshold: 888}
# Provisional continuation of the verified 2025 return rules pending 2026 CRA forms.
claimants:
  childAmount: {claimant: lower-net-income, transfer: none, estimated: true}
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: false, order: after-foreign-tax-credit, estimated: true}
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
salesTax: {rate: 0.14, label: "14% HST"}
propertyTax: {rate: 0.0061, city: Halifax}
# NRCan also lists a Provincial Clean Fuels Adjuster here (3.74¢ a litre on gasoline): an allowance that
# the Utility and Review Board builds into the regulated pump price to pass on suppliers' cost of the federal
# Clean Fuel Regulations. It isn't a tax paid to government, so it isn't counted.
fuelTax: {gasoline: 0.155}   # $ per litre
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 9,370.2 million
# vehicle-km ÷ 537,694 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 17400, estimated: true}
childBenefit:
  name: Nova Scotia Child Benefit
  program: nova-scotia-child-benefit
  params: {perChild: 1525, fullBelow: 26000, partialBelow: 34000, partialOtherChildren: 762.5}
credits:
  - name: Nova Scotia affordable living tax credit
    program: ns-affordable-living-tax-credit
    params: {base: 255, child: 60, rate: 0.05, threshold: 30000}
sources:
