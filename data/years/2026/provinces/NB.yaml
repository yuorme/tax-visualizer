code: NB
name: New Brunswick
order: 9
brackets:
  - [52333, 0.094]
  - [104666, 0.14]
  - [193861, 0.16]
  - [.inf, 0.195]
basicPersonalAmount: 13664
dividendTaxCredit: {eligible: 0.14, nonEligible: 0.0275}
spouseAmount: {max: 10709, threshold: 1072}
# Provisional continuation of the verified 2025 return rules pending 2026 CRA forms.
claimants:
  lowIncomeReduction: {claimant: minimum-household-tax, transferUnused: true, order: after-foreign-tax-credit, estimated: true}
lowIncomeReduction:
  program: nb-low-income-reduction
  params: {amount: 818, rate: 0.03, threshold: 22358}
  estimated: true   # 2025 figures indexed by 2%
salesTax: {rate: 0.15, label: "15% HST"}
propertyTax: {rate: 0.0136, city: Moncton}
# NRCan also lists a Provincial Clean Fuels Adjuster here (8.0¢ a litre on gasoline): an allowance that
# the Energy and Utilities Board builds into the regulated pump price to pass on suppliers' cost of the federal
# Clean Fuel Regulations. It isn't a tax paid to government, so it isn't counted.
fuelTax: {gasoline: 0.1087}   # $ per litre
# Starting distance: the average per light vehicle in the 2009 Canadian Vehicle Survey (the last one), 7,765.2 million
# vehicle-km ÷ 481,760 vehicles up to 4.5 tonnes (Tables 4-1 and 3-1), to the nearest 100 km.
driving: {distance: 16100, estimated: true}
childBenefit:
  name: NB Child Tax Benefit
  program: nb-child-tax-benefit
  params:
    perChild: 250
    threshold: 20000
    rateOneChild: 0.025
    rateMoreChildren: 0.05
    workingIncomeSupplement: {rate: 0.04, floor: 3750, max: 250, threshold: 20921, phaseOut: 0.05}
credits:
  - name: New Brunswick HST credit
    program: nb-hst-credit
    params: {adult: 300, spouse: 300, child: 100, rate: 0.02, threshold: 35000}
sources:
  - {label: "Guide T5007 – Return of Benefits", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/t4115/guide-t5007-return-benefits.html"}
  - {label: "Social assistance payments – Personal income tax", url: "https://www.canada.ca/en/revenue-agency/services/tax/individuals/topics/about-your-tax-return/tax-return/completing-a-tax-return/personal-income/line-145-social-assistance-payments.html"}
  - {label: "2025 NB Low-Income Seniors' Benefit Application", url: "https://www2.snb.ca/content/dam/snb/lisb-pafr/lisb-application-2025.pdf"}
  - {label: "T1 Family File, Final Estimates, 2023 Section 3 - Glossary of terms", url: "https://www150.statcan.gc.ca/n1/pub/72-212-x/2025001/sect3-eng.htm"}
  - label: CHAPTER N-6.001 CHAPITRE N-6.001
    url: https://laws.gnb.ca/en/pdf/cs/N-6.001.pdf
  - label: New Brunswick Low Income Seniors Benefit
    url: https://www2.gnb.ca/content/gnb/en/corporate/promo/new-brunswick-low-income-seniors-benefit.html
  - {"label": "New Brunswick Tax and Credits", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-c/5004-c-25e.pdf"}
  - {"label": "Provincial Amounts Transferred from your Spouse or Common-Law Partner", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-s2/5004-s2-25e.pdf"}
  - {"label": "Worksheet NB428", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-d/5004-d-25e.pdf"}
  - {"label": "2026 New Brunswick Personal Tax Credits Return", "url": "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/td1nb/td1nb-26e.pdf"}
  - {label: "CRA NB 2025 guide, claimant and transfer rules", url: "https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/general-income-tax-benefit-package/new-brunswick/5004-pc.html"}
  - {label: "CRA NB428 2025, reduction order and unused balance", url: "https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5004-c/5004-c-25e.pdf"}
  - {label: "nesto, Canada Property Tax Guide 2026 (residential property tax rate)", url: "https://www.nesto.ca/mortgage-basics/property-taxes-canada-highest-to-lowest/"}
  - {label: "Natural Resources Canada, Fuel Consumption Levies in Canada (provincial gasoline tax, rates as of September 2, 2026)", url: "https://natural-resources.canada.ca/domestic-international-markets/fuel-consumption-levies-canada"}
  - {label: "Statistics Canada, Canadian Vehicle Survey: Annual 2009, Tables 3-1 and 4-1 (distance per light vehicle)", url: "https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf"}

seniorCredits:
  # Published 2026 amounts; filing formulas/transfer ordering provisionally continue 2025.
  provisionalRules: true
  age:
    program: age-net-income
    params: {minimumAge: 65, maximum: 6158, threshold: 45844, reductionRate: 0.15}
  pension: {program: federal-pension-capped, params: {maximum: 1000}}
  transfer: schedule2-unused-base

# 2025/2026 senior supplements: current income proxies historical income; ordinary residence assumed.
# Estimated entries: see docs/verification/21-provincial-supplements.md for explicit derivations.
seniorSupplements:
  - program: nb-low-income-seniors-benefit
    name: New Brunswick Low-Income Seniors' Benefit
    params:
      annual: 629
    # Prior age/receipt uses current federal rates as an income-history proxy; T5007 classification is inferred from Statistics Canada and CRA.
    estimated: true
    reporting:
      kind: t5007
      exemptThrough: 0
