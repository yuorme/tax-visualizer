# Fuel tax on gasoline, $ per litre. The fuel tax relief program sets the rate each quarter from the price of WTI
# crude: the full 13¢ until September 30, 2026, then nil from October 1 (WTI averaged over US$90).
fuelTax:
  gasoline:
    - {from: "2026-01-01", rate: 0.13}
    - {from: "2026-10-01", rate: 0, note: "fuel tax relief program, through at least December 31"}
