# Federal parameters for 2022. Recurring benefits use July 2022–June 2023 amounts, applied to current-year
# income. Extraordinary inflation-support payments are excluded. Calendar-year carbon records are in each province.
year: 2022

# CRA T4127 January 2022, table 8.1 and federal BPA formula.
brackets:
  - [50197, 0.15]
  - [100392, 0.205]
  - [155625, 0.26]
  - [221708, 0.29]
  - [.inf, 0.33]
basicPersonalAmount: {max: 14398, min: 12719, from: 155625, to: 221708}
quebecAbatement: 0.165
employmentAmount: 1287
indexation: 0.024

investment:
  # Schedule 3 gives 50%; Finance Canada's 2023 tax-expenditures report explicitly states 2022 dividend rates.
  capitalGainsInclusion: 0.5
  grossUp: {eligible: 1.38, nonEligible: 1.15}
  dividendTaxCredit: {eligible: 0.150198, nonEligible: 0.090301}
  # Treaty Article X(2)(b) and Income Tax Act 20(11), archived section in force June 2019–June 2023.
  foreignWithholding: {usTreaty: 0.15, deductibleAbove: 0.15}

rrsp: {rate: 0.18, limit: 29210}

# T4127 payroll caps/rates; ESDC's October–December 2022 table separates base and additional contributions.
# CPP2/QPP2 do not exist yet: no second band and zero second additional rate.
payroll:
  cpp: {exempt: 3500, ympe: 64900, yampe: 64900, base: 0.0495, enh1: 0.0075, enh2: 0}
  qpp: {exempt: 3500, ympe: 64900, yampe: 64900, base: 0.054, enh1: 0.0075, enh2: 0}
  ei: {maxInsurable: 60300, rate: 0.0158, quebecRate: 0.012}
  qpip: {maxInsurable: 88000, rate: 0.00494}

childBenefit: # T4114 July 2022–June 2023, printed pages 15–16.
  perChildUnder6: 6997
  perChild6to17: 5903
  threshold1: 32797
  threshold2: 71060
  rate1: [0, 0.07, 0.135, 0.19, 0.23]
  fixed2: [0, 2678, 5166, 7270, 8801]
  rate2: [0, 0.032, 0.057, 0.08, 0.095]

groceriesBenefit: # CRA recurring GST/HST calculation sheet, 2021 base year.
  name: GST/HST credit
  adult: 306
  spouseOrFirstChild: 306
  child: 161
  singleSupplement: {max: 161, rate: 0.02, from: 9919}
  phaseOut: {rate: 0.05, from: 39826}

workersBenefit: # Published 2022 Schedule 6; disability supplement excluded.
  # Quebec income-at-maximum thresholds are exact quotients: excluded earnings + maximum / phase-in rate.
  # single 2400+3296.57/.373; couple 3600+5146.65/.373; parent 2400+1767.60/.20;
  # couple with children 3600+3297.72/.239. This preserves the published dollar maxima without rounding.
  estimated: true
  estimationNote: "Quebec's income-at-maximum thresholds are derived from the published Schedule 6 maxima divided by their phase-in rates, plus excluded earnings; all benefit amounts and reduction thresholds are published 2022 values"
  standard: {max: [1428, 2461], rate: 0.27, floor: [3000, 3000], threshold: [23495, 26805], phaseOut: [0.15, 0.15]}
  secondaryEarnerExemption: 14336
  regional:
    AB: {max: [1531, 2292], rate: 0.21, floor: [2760, 2760], threshold: [22886, 28672], phaseOut: [0.15, 0.15]}
    NU: {max: [1418, 2130], rate: 0.14, floor: [6000, 6000], threshold: [23475, 32307], phaseOut: [0.04, 0.08]}
  quebec:
    phaseOutRate: 0.20
    single: [0.373, 2400, 11237.989276139411, 12589.79]
    couple: [0.373, 3600, 17397.989276139408, 19326.77]
    parent: [0.20, 2400, 11238, 12650.47]
    coupleKids: [0.239, 3600, 17397.991631799163, 19424.35]

