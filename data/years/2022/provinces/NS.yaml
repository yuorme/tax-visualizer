# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Halifax urban rate: (0.794 municipal + 0.360 mandatory/area levies) / 100 = 0.01154.
# Partial child benefit is the statutory 50% of $1275 = $637.50.

code: NS
name: Nova Scotia
order: 11
brackets:
  - [29590, 0.0879]
  - [59180, 0.1495]
  - [93000, 0.1667]
  - [150000, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: {max: 11481, min: 8481, from: 25000, to: 75000}
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.0299}
spouseAmount:
  program: nova-scotia-spouse-amount
  params:
    max: 8481
    threshold: 848
    supplement: {max: 3000, rate: 0.06, threshold: 25000}
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
salesTax: {rate: 0.15, label: 15% HST}
propertyTax: {rate: 0.01154, city: Halifax}
childBenefit:
  name: Nova Scotia Child Benefit
  program: nova-scotia-child-benefit
  params: {perChild: 1275, fullBelow: 26000, partialBelow: 34000, partialOtherChildren: 637.5}
