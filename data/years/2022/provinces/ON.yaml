# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Child maximum annualizes the CRA monthly amount: $125.75 × 12 = $1509.
# OEPTC maximum is $249 energy + $62 base + $810 property component.
# Toronto total rate: (0.472052 municipal + 0.006881 city building + 0.153000 education) / 100.

