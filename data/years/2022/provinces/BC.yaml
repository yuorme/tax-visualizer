# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Nine ordinary months and three enhanced months are calculated separately before weighting by 0.75 and 0.25.
# Enhanced child increments are statutory cumulative differences: 4000−2300=1700; 2580−1300=1280.
# B.C. renter credit and single-parent supplement are absent before calendar/July 2023 respectively.
# Vancouver total residential rate is 2.69293 per 1000 taxable assessment.

code: BC
name: British Columbia
order: 0
brackets:
  - [43070, 0.0506]
  - [86141, 0.077]
  - [98901, 0.105]
  - [120094, 0.1229]
  - [162832, 0.147]
  - [227091, 0.168]
  - [.inf, 0.205]
basicPersonalAmount: 11302
dividendTaxCredit: {eligible: 0.12, nonEligible: 0.0196}
spouseAmount: {max: 9678, threshold: 968}
bcTaxReduction: {max: 491, rate: 0.0356, threshold: 21867}
salesTax: {rate: 0.12, label: 5% GST + 7% PST}
propertyTax: {rate: 0.00269293, city: Vancouver}
childBenefit:
  name: B.C. child opportunity / family benefit
  program: bc-family-benefit-periods
  params:
    periods:
      - weight: 0.75
        max: [1600, 1000, 800]
        min: [700, 680, 660]
        singleParent: 0
        rate: 0.04
        threshold: 25806
        minThreshold: 82578
      - weight: 0.25
        max: [2300, 1700, 1500]
        min: [1300, 1280, 1260]
        singleParent: 0
        rate: 0.04
        threshold: 25806
        minThreshold: 82578
