            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [36142, 42165]
            rate: 0.005
          - date: 2022-04-01
            adult: 43.5
            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [36142, 42165]
            rate: 0.005
          - date: 2022-07-01
            adult: 48.375
            spouse: 48.375
            child: 14.125
            firstChild: 48.375
            threshold: [36901, 43051]
            rate: 0.005
          - date: 2022-10-01
            adult: 212.375
