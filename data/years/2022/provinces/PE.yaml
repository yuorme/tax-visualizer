childAmount: {perChild: 1200, ages: under6}
postDividendSurtax:
  program: pei-surtax
  params: {threshold: 12500, rate: 0.1}

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15100
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2022-01-01
      rate: 0.0663
    - from: 2022-05-09
      rate: 0.1105
  heating:
    amount: 0
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 0.0000 GJ gas and 35.2661 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - name: PEI carbon rebate
      program: pei-carbon-rebate-increment
      params:
        payments:
          - date: 2022-07-05
            weight: 0.25
            regular:
              individual: 110
              spouseOrDependant: 55
              supplementRate: 0.005
              supplementFrom: 30000
              supplementMax: 55
              threshold: 50000
              rate: 0.02
            enhanced:
              individual: 670
              spouseOrDependant: 55
              supplementRate: 0.005
              supplementFrom: 30000
              supplementMax: 55
              threshold: 50000
              rate: 0.04
