# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Charlottetown resident rate: (0.67 municipal + 1.50 provincial − 0.50 resident credit) / 100.
# Regular sales-tax credit only; extraordinary 2022/23 cost-of-living payments are outside this model.
# PEI child benefit is absent; it began January 2025. The 10% surtax applies after the dividend credit.

code: PE
name: Prince Edward Island
shortName: PEI
order: 10
brackets:
  - [31984, 0.098]
  - [63969, 0.138]
  - [.inf, 0.167]
basicPersonalAmount: 11250
dividendTaxCredit: {eligible: 0.105, nonEligible: 0.013}
spouseAmount: {max: 9555, threshold: 955}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 350, spouse: 350, child: 300, rate: 0.05, threshold: 20000}
salesTax: {rate: 0.15, label: 15% HST}
propertyTax: {rate: 0.0167, city: Charlottetown}
credits:
  - name: PEI sales tax credit
    program: pei-sales-tax-credit
    params: {individual: 110, spouseOrDependant: 55, supplementRate: 0.005, supplementFrom: 30000, supplementMax: 55, rate: 0.02, threshold: 50000}
sources:
  - {label: "CRA, PE428 for 2022", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-c/5002-c-22e.pdf}
  - {label: "CRA, PE428 worksheet for 2022", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5002-d/5002-d-22e.pdf}
  - {label: "CRA, RC4210-22: July 2022–June 2023 credits (official guide archived by DT Tax; original CRA link retired)", url: https://support.drtax.ca/dtmax/eng/kb/dtmax/eng/rc4210-22e.pdf}
  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "PEI Real Property Tax Act sections 4 and 5: rates last amended before 2023", url: https://www.princeedwardisland.ca/sites/default/files/legislation/r-05-real_property_tax_act.pdf}
  - label: Stratford, March 2022 Finance agenda p34 municipal rate comparison
    url: https://stratford.civicweb.net/document/116965
childAmount: {perChild: 1200, ages: under6}
postDividendSurtax:
  program: pei-surtax
  params: {threshold: 12500, rate: 0.1}
