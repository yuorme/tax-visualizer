# Property estimate applies Iqaluit residential class 7/8 rate 20.13 mills / 1000 to home value.
# This assumes assessed value equals home value; other residential classes have different rates.
# Child maximum annualizes CRA monthly $27.50 × 12 = $330.
# Reduction rates 3%/5% are assumed unchanged from the Nunavut-commissioned 2013 report.

