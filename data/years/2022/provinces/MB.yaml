# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Property estimate uses Winnipeg School Division: (13.468 municipal + 14.547 school) mills × 45% / 1000.
# School-tax share is 14.547 / 28.015; gross tax is before the 37.5% rebate and capped $437.50 credit.

code: MB
name: Manitoba
order: 5
brackets:
  - [34431, 0.108]
  - [74416, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: 10145
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
salesTax: {rate: 0.12, label: 5% GST + 7% RST}
propertyTax: {rate: 0.01260675, city: Winnipeg, estimated: true}
creditsUseRent: true
credits:
  - name: School tax rebate and education property tax credit
    nameRenter: Renters tax credit
    program: mb-school-tax-credits
    params: {schoolTaxShare: 0.5192575406032482, schoolRebateRate: 0.375, educationCreditMax: 437.5, renterMax: 525}
    estimated: true
sources:
