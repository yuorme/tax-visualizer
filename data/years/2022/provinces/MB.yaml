  name: Federal carbon pricing
  gasoline:
    - from: 2022-01-01
      rate: 0.0884
    - from: 2022-04-01
      rate: 0.1105
  heating:
    amount: 123.18
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 49.2892 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
