  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "CRA, MB479 for 2022: school-tax and renters credits", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-tc/5007-tc-22e.pdf}
  - {label: "Manitoba, Budget 2022 school tax rebate 37.5% and education property credit $437.50", url: https://www.gov.mb.ca/budget2022/tax-and-fee-measures.html}
  - label: City of Winnipeg, 2022 combined mill rates and 45% residential assessment portion
    url: https://assessment.winnipeg.ca/Asmttax/pdfs/rates/2022CombinedMillRates.pdf
