# Benefit-year figures use July 2022 to June 2023, applied to current-year income.
# Low-income credit taper estimated as 998 / (70045 − 33755), using published maximum family benefit and endpoints.
# Property rate: ((city 8.1836 + library 0.8430) mills × factor 0.8853 + school 4.54) × 80% / 1000.

code: SK
name: Saskatchewan
order: 4
brackets:
  - [46773, 0.105]
  - [133638, 0.125]
  - [.inf, 0.145]
basicPersonalAmount: 16615
dividendTaxCredit: {eligible: 0.11, nonEligible: 0.01695}
spouseAmount: {max: 16615, threshold: 1662}
childAmount: {perChild: 6303, ages: all}
salesTax: {rate: 0.11, label: 5% GST + 6% PST}
propertyTax: {rate: 0.010024999184000002, city: Saskatoon, estimated: true}
credits:
  - name: Saskatchewan low-income tax credit
    program: sk-low-income-tax-credit
    params: {adult: 358, spouse: 358, child: 141, maxChildren: 2, rate: 0.0275006888950124, threshold: 33755}
    estimated: true
sources:
