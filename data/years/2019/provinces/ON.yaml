# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# Child maximum annualizes rounded CRA monthly $119.50 × 12 = $1434.
# OEPTC propertyMax is published $828 total cap minus $59 base = $769.
# Toronto 2020 annual report explicitly gives 2019 total 0.6147700% = 0.0061477.

code: ON
