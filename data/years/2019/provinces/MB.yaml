# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# Annual sales-tax estimate assumes equal monthly taxable spending: 5% GST +(6×8% +6×7%)/12=12.5%.
# Property estimate: (13.290 municipal + 15.130 Winnipeg school) mills × 45% assessed portion / 1000.
# School-tax share is 15.130 / 28.420; no school-tax rebate before 2021.
# MB 479 caps the credit at $700 or school tax / 20% of annual rent, whichever is less.

code: MB
name: Manitoba
order: 5
brackets:
  - [32670, 0.108]
  - [70610, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: 9626
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
# MB428-A lines 1–3, 9 and 11: ordinary bases and taper are not indexed.
# Line 9 includes children turning 18; ordinary eligible-parent assumptions follow #145.
familyTaxBenefit:
  program: mb-family-tax-benefit
  claimant: higher-net-income
  # Interpretation from #145/#92: on equal net incomes elect the whole child claim minimizing household tax.
  tie: household-minimum
  params: {basic: 2065, dependant: 2065, child: 2752, reductionRate: 0.09, childThrough: 18}
salesTax: {rate: 0.125, label: 5% GST + 7.5% average RST, estimated: true}
propertyTax: {rate: 0.012789000000000002, city: Winnipeg, estimated: true}
creditsUseRent: true
credits:
  - name: Education property tax credit
    nameRenter: Education property tax credit
    program: mb-school-tax-credits-rent-share
    params: {schoolTaxShare: 0.5323715693173822, schoolRebateRate: 0, educationCreditMax: 700, renterMax: 700, renterShare: 0.2}
    estimated: true
sources:
  - {label: "CRA, 2019 MB428-A (family benefit bases and individual net-income taper)", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-a/5007-a-19e.pdf}
  - {label: "CRA, 2019 Manitoba guide (family benefit child eligibility, exclusions and higher-income spouse)", url: https://www.canada.ca/en/revenue-agency/services/forms-publications/tax-packages-years/archived-general-income-tax-benefit-package-2019/manitoba/5007-pc/information-residents-manitoba.html}
  - {label: "CRA, MB 428 for 2019", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-c/5007-c-19e.pdf}
  - {label: "CRA, MB 428 worksheet for 2019", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-d/5007-d-19e.pdf}
  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "CRA, MB 479 for 2019: education property-tax credit and eligible occupancy cost", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-tc/5007-tc-19e.pdf}
  - {label: "Manitoba, historical property credits: school-tax rebate introduced in 2021", url: https://www.gov.mb.ca/edupropertytax/index.html}
  - {label: "Winnipeg, 2019 combined mill rates and residential assessment portion", url: https://assessment.winnipeg.ca/Asmttax/pdfs/rates/2019CombinedMillRates.pdf}
  - {label: "Manitoba, July 1 2019 retail sales tax reduction 8% to 7%", url: https://www.gov.mb.ca/finance/taxation/pubs/bulletins/noticerst1901.pdf}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
    url: https://www150.statcan.gc.ca/n1/tbl/csv/25100060-eng.zip
  - label: "Carbon history: Natural Gas: A Primer"
    url: https://natural-resources.canada.ca/energy-sources/fossil-fuels/natural-gas-primer
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: GREENHOUSE"
    url: https://www.canada.ca/content/dam/eccc/documents/pdf/climate-change/pricing-pollution/greenhouse-gas-pollution-pricing-act-annual-report-2019.pdf

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2019-01-01
      rate: 0
    - from: 2019-04-01
      rate: 0.0442
  heating:
    amount: 38.99
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 49.2892 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2019-04-01
            adult: 170
            spouse: 85
            child: 42
            firstChild: 85
            threshold: [0, 0]
            rate: 0
