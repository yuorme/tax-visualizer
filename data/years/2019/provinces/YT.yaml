# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# Yukon Hansard confirms annual $820 child benefit for 2015/16 through 2022/23.
# Whitehorse 2020 budget explicit 2019 comparative residential 1.097% /100=0.01097.

code: YT
name: Yukon
territory: true
order: 1
brackets:
