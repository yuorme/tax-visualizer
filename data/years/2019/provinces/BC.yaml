# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# The early-childhood benefit pays only children under six; opportunity benefit began October 2020.
# Vancouver official Appendix A total residential 2.56116 mills /1000; additional high-value school surtax excluded.
# MSP assumes full-year enrolled residents eligible for regular premium assistance, using current-year family net income.
# Annual per-adult premiums are statutory monthly [0,11.50,17.50,23,28,32.50,37.50] ×12.
# Spouse and child deductions are 3000 each; half the child-care deduction is added back to family net income.
# MSP age 65/disability/student exemptions follow the model scope: under 65 adults, children under 18, no disability inputs.

