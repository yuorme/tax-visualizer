# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# 2020 official parameter tables explicitly publish 2019 comparatives; no reverse-indexation.
# Family allowance uses calendar 2019 and ordinal child maxima/minima; solidarity uses July 2019–June 2020.
# Living-alone amount retains the model assumption that every one-adult household qualifies.
# Property estimate uses Ville-Marie: (0.6519 base + 0.1083 water + 0.0036 roads + 0.0025 ARTM
# + 0.0062 borough capital + 0.0433 borough services) / 100 = 0.008158.
# This municipal rate excludes the separately collected school levy.
# The citywide-average budget was unavailable; this is an explicit representative-borough proxy.

code: QC
name: Quebec
order: 8
system: quebec
brackets:
  - [43790, 0.15]
  - [87575, 0.2]
  - [106555, 0.24]
  - [.inf, 0.2575]
basicPersonalAmount: 15269
dividendTaxCredit: {eligible: 0.1178, nonEligible: 0.0555}
spouseAmount: transfer
quebec:
  workerDeduction: {rate: 0.06, max: 1170}
  livingAlone: {max: 1750, rate: 0.1875, threshold: 34610}
salesTax: {rate: 0.14975, label: 5% GST + 9.975% QST}
propertyTax: {rate: 0.008158, city: Montreal, note: Ville-Marie proxy; school tax is billed separately, estimated: true}
