# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# NS 2012 regulation sets exact first-child 624.96, subsequent 825/900;2014 regulation sets graduated taper.
# Halifax total: (0.670 urban +0.047 regional transit +0.098 local transit +0.013 fire +0.305 education
# +0.017 valuation +0.016 corrections +0.006 housing +0.024 supplementary education)/100=0.01196.

code: NS
name: Nova Scotia
order: 11
brackets:
  - [29590, 0.0879]
  - [59180, 0.1495]
  - [93000, 0.1667]
  - [150000, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: {max: 11481, min: 8481, from: 25000, to: 75000}
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.0299}
spouseAmount:
  program: nova-scotia-spouse-amount
  params:
    max: 8481
    threshold: 848
    supplement: {max: 3000, rate: 0.06, threshold: 25000}
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
salesTax: {rate: 0.15, label: 15% HST}
propertyTax: {rate: 0.01196, city: Halifax}
childBenefit:
  name: Nova Scotia Child Benefit
  program: nova-scotia-child-benefit-reduction
  params:
    perChild: [624.96, 825, 900]
    fullBelow: 18001
    threshold: 18000
    rate: [0.0781, 0.1812]
    additionalRate: 0.1125
credits:
  - name: Nova Scotia affordable living tax credit
    program: ns-affordable-living-tax-credit
    params: {base: 255, child: 60, rate: 0.05, threshold: 30000}
