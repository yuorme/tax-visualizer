# Benefit-year figures use July 2019 to June 2020, applied to current-year income.
# Regular sales credit only; extraordinary payments and carbon measures excluded.
# Charlottetown 2019 report and unchanged 2020 budget establish 0.67 city +1.50 province −0.50 resident credit per 100.

