# Federal parameters for the 2024 tax year.
# CCB and GST/HST amounts cover July 2024–June 2025 (2023 income in administration); as in other years,
# this comparison applies the benefit-year amounts to current-year income. Carbon pricing is tracked in #29.
year: 2024

# T4127, January 2024, tables 8.1–8.2. The 15% first bracket is also the non-refundable credit rate.
brackets:
  - [55867, 0.15]
  - [111733, 0.205]
  - [173205, 0.26]
  - [246752, 0.29]
  - [.inf, 0.33]
basicPersonalAmount: {max: 15705, min: 14156, from: 173205, to: 246752}
quebecAbatement: 0.165
employmentAmount: 1433
indexation: 0.047

investment:
  # CRA's January 31, 2025 clarification confirms 50% for all 2024 gains; the proposed increase never applied.
  capitalGainsInclusion: 0.5
  # Finance Canada's 2025 tax expenditures report expressly gives these rates and gross-ups for 2024.
  grossUp: {eligible: 1.38, nonEligible: 1.15}
  dividendTaxCredit: {eligible: 0.150198, nonEligible: 0.090301}
  # Notes only: Canada–U.S. treaty Article X(2)(b), and Income Tax Act subsection 20(11).
  foreignWithholding: {usTreaty: 0.15, deductibleAbove: 0.15}

# CRA registered-plan limits: the RRSP column, not the money-purchase ($32,490) column.
rrsp: {rate: 0.18, limit: 31560}

# T4127 tables 8.4–8.10. 2024 is the first year of second additional CPP/QPP contributions (CPP2/QPP2).
payroll:
  cpp: {exempt: 3500, ympe: 68500, yampe: 73200, base: 0.0495, enh1: 0.01, enh2: 0.04}
  qpp: {exempt: 3500, ympe: 68500, yampe: 73200, base: 0.054, enh1: 0.01, enh2: 0.04}
  ei: {maxInsurable: 63200, rate: 0.0166, quebecRate: 0.0132}
  qpip: {maxInsurable: 94000, rate: 0.00494}

childBenefit: # T4114, July 2024–June 2025.
  perChildUnder6: 7787
  perChild6to17: 6570
  threshold1: 36502
  threshold2: 79087
  rate1: [0, 0.07, 0.135, 0.19, 0.23]
  fixed2: [0, 2981, 5749, 8091, 9795]
  rate2: [0, 0.032, 0.057, 0.08, 0.095]

groceriesBenefit: # CRA GST/HST calculation sheet, July 2024–June 2025 (2023 base year).
  name: GST/HST credit
  adult: 340
  spouseOrFirstChild: 340
  child: 179
  singleSupplement: {max: 179, rate: 0.02, from: 11039}
  phaseOut: {rate: 0.05, from: 44324}

workersBenefit: # 2024 Schedule 6; [single, family] pairs; disability supplement excluded.
  # The Quebec income-at-maximum values below are derived from Schedule 6's published dollar maxima:
  # single 2,400 + 3,705.38 / 0.373 = 12,333.994638069706; parent 2,400 + 1,986.80 / 0.20 = 12,334;
  # couple 3,600 + 5,778.52 / 0.373 = 19,092.010723860592;
  # couple with children 3,600 + 3,702.59 / 0.239 = 19,092.00836820084.
  # Keeping the exact quotients preserves the published maxima rather than rounding a derived threshold.
  estimated: true
  estimationNote: "Quebec's income-at-maximum thresholds are derived from the published Schedule 6 maxima divided by their phase-in rates, plus excluded earnings; all benefit amounts and reduction thresholds are published 2024 values"
  standard: {max: [1590, 2739], rate: 0.27, floor: [3000, 3000], threshold: [26149, 29833], phaseOut: [0.15, 0.15]}
  secondaryEarnerExemption: 15955
  regional:
    AB: {max: [1704, 2551], rate: 0.21, floor: [2760, 2760], threshold: [25472, 31911], phaseOut: [0.15, 0.15]}
    NU: {max: [1578, 2371], rate: 0.14, floor: [6000, 6000], threshold: [26127, 35957], phaseOut: [0.04, 0.08]}
  quebec:
    phaseOutRate: 0.20
    single: [0.373, 2400, 12333.994638069706, 13829.82]
    couple: [0.373, 3600, 19092.010723860592, 21257.44]
    parent: [0.20, 2400, 12334, 13981.83]
    coupleKids: [0.239, 3600, 19092.00836820084, 21456.77]

