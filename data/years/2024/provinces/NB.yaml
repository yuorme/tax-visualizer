spouseAmount: { max: 10223, threshold: 1023 }
lowIncomeReduction:
  program: nb-low-income-reduction
  params: { amount: 781, rate: 0.03, threshold: 21343 }
salesTax: { rate: 0.15, label: 15% HST }
propertyTax: { rate: 0.0136, city: Moncton, estimated: true }
childBenefit:
