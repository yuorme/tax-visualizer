# Benefit-year figures use July 2024 to June 2025, applied to current-year income.
# Property estimate uses Winnipeg School Division: (13.352 municipal + 13.930 school) mills × 45% portion / 1000.
# School-tax share estimated as 13.930 / 27.282 for the same district; gross property tax precedes both credits.

code: MB
name: Manitoba
order: 5
brackets:
