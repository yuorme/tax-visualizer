# Benefit-year figures use July 2024 to June 2025, applied to current-year income.
# PEI child benefit began January 2025: six months × $30/$20 = $180/$120 in July 2024–June 2025 period.

code: PE
name: Prince Edward Island
shortName: PEI
order: 10
brackets:
  - [32656, 0.0965]
  - [64313, 0.1363]
  - [105000, 0.1665]
  - [140000, 0.18]
  - [.inf, 0.1875]
basicPersonalAmount: 13500
dividendTaxCredit: {eligible: 0.105, nonEligible: 0.013}
spouseAmount: {max: 11466, threshold: 1147}
lowIncomeReduction:
