# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# Property estimate uses Winnipeg School Division: (13.161 city + 14.583 school) mills × 45% / 1000.
# School-tax share is 14.583 / 27.744; gross tax is before the 25% rebate and capped $525 credit.
# Renter share is 20% of rent × 75% allowable occupancy costs = 15%, from MB479 page 2.

code: MB
name: Manitoba
order: 5
brackets:
  - [33723, 0.108]
  - [72885, 0.1275]
  - [.inf, 0.174]
basicPersonalAmount: 9936
dividendTaxCredit: {eligible: 0.08, nonEligible: 0.007835}
spouseAmount: {max: 9134, threshold: 0}
salesTax: {rate: 0.12, label: 5% GST + 7% RST}
propertyTax: {rate: 0.0124848, city: Winnipeg, estimated: true}
creditsUseRent: true
credits:
  - name: School tax rebate and education property tax credit
    nameRenter: Renters tax credit
    program: mb-school-tax-credits-rent-share
    params: {schoolTaxShare: 0.5256271626297578, schoolRebateRate: 0.25, educationCreditMax: 525, renterMax: 525, renterShare: 0.15}
    estimated: true
sources:
  - {label: "CRA, MB428 for 2021", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-c/5007-c-21e.pdf}
  - {label: "CRA, MB428 worksheet for 2021", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-d/5007-d-21e.pdf}
  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "CRA, MB479 for 2021: education property-tax credit and eligible occupancy cost", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5007-tc/5007-tc-21e.pdf}
  - {label: "Manitoba, historical 2021 school-tax rebate of 25%", url: https://www.gov.mb.ca/edupropertytax/index.html}
  - {label: "Winnipeg, 2021 combined mill rates and residential assessment portion", url: https://assessment.winnipeg.ca/Asmttax/pdfs/rates/2021CombinedMillRates.pdf}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
    url: https://www150.statcan.gc.ca/n1/tbl/csv/25100060-eng.zip
  - label: "Carbon history: Natural Gas: A Primer"
    url: https://natural-resources.canada.ca/energy-sources/fossil-fuels/natural-gas-primer
  - label: "Carbon history: Fuel charge rates"
    url: https://www.canada.ca/en/revenue-agency/services/forms-publications/publications/fcrates/fuel-charge-rates.html
  - label: "Carbon history: Climate Action Incentive Payment Amounts for 2021"
    url: https://www.canada.ca/en/department-finance/news/2020/12/climate-action-incentive-payment-amounts-for-2021.html

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2021-01-01
      rate: 0.0663
    - from: 2021-04-01
      rate: 0.0884
  heating:
    amount: 97.24
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 49.2892 GJ gas and 0.0000 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2021-04-01
            adult: 360
            spouse: 180
            child: 90
            firstChild: 180
            threshold: [0, 0]
            rate: 0
