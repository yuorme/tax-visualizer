# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# B.C. renter credit and single-parent supplement do not begin until 2023.
# Vancouver published residential total is 2.92250 mills / 1000.

code: BC
name: British Columbia
order: 0
brackets:
  - [42184, 0.0506]
  - [84369, 0.077]
  - [96866, 0.105]
  - [117623, 0.1229]
  - [159483, 0.147]
  - [222420, 0.168]
  - [.inf, 0.205]
basicPersonalAmount: 11070
dividendTaxCredit: {eligible: 0.12, nonEligible: 0.0196}
spouseAmount: {max: 9479, threshold: 948}
bcTaxReduction: {max: 481, rate: 0.0356, threshold: 21418}
salesTax: {rate: 0.12, label: 5% GST + 7% PST}
propertyTax: {rate: 0.0029225, city: Vancouver}
childBenefit:
  name: B.C. child opportunity benefit
  program: bc-family-benefit
  params:
    max: [1600, 1000, 800]
    min: [700, 680, 660]
    singleParent: 0
    threshold: 25275
    minThreshold: 80880
    rate: 0.04
sources:
  - {label: "CRA, BC428 for 2021", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-c/5010-c-21e.pdf}
  - {label: "CRA, BC428 worksheet for 2021", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5010-d/5010-d-21e.pdf}
  - {label: "CRA, T4114-21: July 2021–June 2022 child benefits (official archive)", url: https://publications.gc.ca/collections/collection_2021/arc-cra/Rv1-36-2021-eng.pdf?download=1}
  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "Vancouver, 2021 residential property-tax rates (manual official PDF web extract)", url: https://vancouver.ca/files/cov/2021-property-tax-rates.pdf}
  - label: "Carbon history: Statistics Canada, Canadian Vehicle Survey: Annual 2009 (53-223-X)"
    url: https://www150.statcan.gc.ca/n1/pub/53-223-x/53-223-x2009000-eng.pdf
  - label: "Carbon history: Statistics Canada 25-10-0060-01 household energy consumption, selected CSV rows"
