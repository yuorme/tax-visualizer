  - label: "Carbon history: Climate Action Tax Credit Regulation"
    url: https://www.bclaws.gov.bc.ca/civix/document/id/complete/statreg/135_2008
  - label: "Carbon history: Past carbon tax rates"
    url: https://www2.gov.bc.ca/gov/content/taxes/sales-taxes/motor-fuel-carbon-tax/publications/carbon-tax-rates-by-fuel-type/past-carbon-tax-rates

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 12900
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: BC carbon tax
  gasoline:
    - from: 2021-01-01
      rate: 0.0889
    - from: 2021-04-01
      rate: 0.0996
  heating:
    amount: 108.74
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 48.5060 GJ gas and 0.2385 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: BC climate action tax credit
      params:
        payments:
          - date: 2021-01-01
            adult: 43.5
            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [35748, 41706]
            rate: 0.005
          - date: 2021-04-01
            adult: 43.5
            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [35748, 41706]
            rate: 0.005
          - date: 2021-07-01
            adult: 43.5
            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [36142, 42165]
            rate: 0.005
          - date: 2021-10-01
            adult: 43.5
            spouse: 43.5
            child: 12.75
            firstChild: 43.5
            threshold: [36142, 42165]
            rate: 0.005
