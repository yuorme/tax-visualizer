  - {label: "CRA, 2021 LIFT Schedule ON428-A", url: https://www.canada.ca/content/dam/cra-arc/formspubs/pbg/5006-a/5006-a-21e.pdf}
  - {label: "Ontario, 2021 tax transparency report: sales and energy/property credits", url: https://budget.ontario.ca/2021/fallstatement/provisions.html}
  - {label: "Toronto, 2021 annual financial report: residential tax rates", url: https://www.toronto.ca/wp-content/uploads/2022/08/8f03-City-of-Toronto-YE-2021-AFR-08-15-2022.pdf}
