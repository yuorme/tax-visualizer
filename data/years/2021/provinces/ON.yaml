# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 16200
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2021-01-01
      rate: 0.0663
    - from: 2021-04-01
      rate: 0.0884
  heating:
    amount: 117.79
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 58.2901 GJ gas and 1.0275 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2021-04-01
            adult: 300
            spouse: 150
            child: 75
            firstChild: 150
            threshold: [0, 0]
            rate: 0
