            adult: 48
            spouse: 48
            child: 48
            firstChild: 48
            threshold: [0, 0]
            rate: 0
          - date: 2021-04-01
            adult: 48
            spouse: 48
            child: 48
            firstChild: 48
            threshold: [0, 0]
            rate: 0
          - date: 2021-07-01
            adult: 44
            spouse: 44
            child: 44
            firstChild: 44
            threshold: [0, 0]
            rate: 0
          - date: 2021-10-01
            adult: 44
            spouse: 44
            child: 44
            firstChild: 44
            threshold: [0, 0]
            rate: 0
  gasoline:
