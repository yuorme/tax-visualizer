  - {label: "CRA, GST/HST historical rates and provincial sales-tax rates", url: https://www.canada.ca/en/revenue-agency/services/tax/businesses/topics/gst-hst-businesses/charge-collect-which-rate/calculator.html}
  - {label: "Yukon Finance, spring 2024 briefing with 2023 child benefit parameters", url: https://open.yukon.ca/information/de20b25e-b7d5-45ed-aacd-5ce4e968bec4/resource/57bd0240-b717-3e8b-9c1e-f9a386d62022/download/fin_spring_2024.pdf}
  - {label: "Yukon Hansard April 16 2026 p667, historical child benefit maximum (manual web extract)", url: https://yukonassembly.ca/sites/default/files/hansard/36-1-24.pdf}
  - {label: "Whitehorse, operating-budget package with 2021 tax-rate comparison", url: https://whitehorse.ca/wp-content/uploads/2024/01/2024-2026-Operating-Budget-Public-Input-Package-FINAL.pdf}
