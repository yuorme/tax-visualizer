# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# Yukon Hansard confirms the exact $820 annual child benefit for 2015/16 through 2022/23.
# Reduction rates 2.5%/5% and $35000 threshold are unchanged in Yukon Finance published program description.
# Whitehorse published 2021 residential rate is 1.070%, shown explicitly in the 2024 comparative table.

code: YT
name: Yukon
territory: true
order: 1
brackets:
  - [49020, 0.064]
  - [98040, 0.09]
  - [151978, 0.109]
  - [500000, 0.128]
  - [.inf, 0.15]
basicPersonalAmount: federal
dividendTaxCredit: {eligible: 0.1202, nonEligible: 0.0067}
spouseAmount: federal
employmentAmountCredit: true
salesTax: {rate: 0.05, label: 5% GST}
propertyTax: {rate: 0.0107, city: Whitehorse}
childBenefit:
  name: Yukon Child Benefit
  program: per-child-reduced
  params: {perChild: 820, threshold: 35000, rateOneChild: 0.025, rateMoreChildren: 0.05}
