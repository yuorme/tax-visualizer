# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# Halifax urban rate: (0.813 municipal + 0.341 mandatory + 0.013 fire + 0.022 supplementary education) / 100.
# Partial child benefit retains the first child maximum and pays 50% for subsequent children.

code: NS
name: Nova Scotia
order: 11
brackets:
  - [29590, 0.0879]
  - [59180, 0.1495]
  - [93000, 0.1667]
  - [150000, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: {max: 11481, min: 8481, from: 25000, to: 75000}
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.0299}
spouseAmount:
  program: nova-scotia-spouse-amount
  params:
    max: 8481
    threshold: 848
    supplement: {max: 3000, rate: 0.06, threshold: 25000}
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
salesTax: {rate: 0.15, label: 15% HST}
propertyTax: {rate: 0.01189, city: Halifax}
childBenefit:
  name: Nova Scotia Child Benefit
  program: nova-scotia-child-benefit-by-child
  params:
    perChild: [925, 825, 900]
    fullBelow: 26000
    partialBelow: 34000
    partialOtherRate: 0.5
credits:
