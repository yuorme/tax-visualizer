driving:
  distance: 16100
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2021-01-01
      rate: 0.0663
    - from: 2021-04-01
      rate: 0.0884
  heating:
    amount: 6.26
    estimated: true
    method: Estimated 2021 Statistics Canada household natural gas (3.1727 GJ) and heating oil (5.0966 GJ), averaged across all households and held fixed across years. Calendar-day provincial and federal rates and heating exemptions apply; see carbon heating verification.
  rebates: []
