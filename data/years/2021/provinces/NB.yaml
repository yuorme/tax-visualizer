# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# HST credit uses the unchanged published 2016 calculation sheet; Moncton table explicitly lists 2021.

code: NB
name: New Brunswick
order: 9
brackets:
  - [43835, 0.094]
  - [87671, 0.1482]
  - [142534, 0.1652]
  - [162383, 0.1784]
  - [.inf, 0.203]
basicPersonalAmount: 10564
dividendTaxCredit: {eligible: 0.14, nonEligible: 0.0275}
spouseAmount: {max: 8970, threshold: 898}
lowIncomeReduction:
  program: nb-low-income-reduction
  params: {amount: 684, rate: 0.03, threshold: 17840}
salesTax: {rate: 0.15, label: 15% HST}
propertyTax: {rate: 0.016497, city: Moncton}
childBenefit:
