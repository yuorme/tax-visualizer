# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 11000
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Carbon pricing
  heating:
    amount: 0
    estimated: true
    method: Estimated 2406 L/year oil proxy from a 2012 Deline residential-building feasibility assumption, reused for the territory; not measured Yellowknife household use. Calendar-day diesel heating rebates apply.
  rebates:
    - name: Cost of Living Offset
      program: carbon-rebate-consolidated-payments
      params:
        payments:
          - date: 2021-01
            adult: 39
            spouse: 39
            child: 45
            firstChild: 45
            threshold: [0, 0]
            rate: 0
            smallPayment:
              below: 50
              multiplier: 0
          - date: 2021-04
            adult: 39
            spouse: 39
            child: 45
            firstChild: 45
            threshold: [0, 0]
            rate: 0
            smallPayment:
              below: 50
              multiplier: 0
          - date: 2021-07-01
            adult: 52
            spouse: 52
            child: 60
            firstChild: 60
            threshold: [0, 0]
            rate: 0
            smallPayment:
              below: 50
              multiplier: 1
          - date: 2021-10-01
            adult: 52
            spouse: 52
            child: 60
            firstChild: 60
            threshold: [0, 0]
            rate: 0
            smallPayment:
              below: 50
              multiplier: 1
  gasoline:
    - from: 2021-01-01
      rate: 0.07
    - from: 2021-07-01
      rate: 0.094
