# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# Child benefits count each age group separately, with exact annual amounts in the official NWT factsheet.
# Property rate: (5.53 municipal + 2.96 school) mills / 1000.

code: NT
name: Northwest Territories
territory: true
order: 3
brackets:
  - [44396, 0.059]
  - [88796, 0.086]
  - [144362, 0.122]
  - [.inf, 0.1405]
basicPersonalAmount: 15243
dividendTaxCredit: {eligible: 0.115, nonEligible: 0.06}
spouseAmount: {max: 15243, threshold: 0}
payroll: {employeeTax: 0.02}
salesTax: {rate: 0.05, label: 5% GST}
propertyTax: {rate: 0.00849, city: Yellowknife}
childBenefit:
  name: NWT Child Benefit
  program: nwt-child-benefit-age-groups
  params:
    under6: [0, 815, 1467, 1997, 2445]
    under6More: 367
    over6: [0, 652, 1174, 1597, 1956]
    over6More: 293
    fullUpTo: 30000
    endsAt: 80000
