# Benefit-year figures use July 2021 to June 2022, applied to current-year income.
# Child maximum annualizes CRA monthly $27.50 × 12 = $330.
# Reduction rates 3%/5% are assumed unchanged from the Nunavut-commissioned 2013 report.
# Property estimate applies residential class 7/8 statutory 19.54 mills / 1000 directly to home value.
# Iqaluit assessed values may differ from market value; other residential classes have different rates.

