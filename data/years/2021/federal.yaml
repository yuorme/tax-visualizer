    url: https://oee.nrcan.gc.ca/corporate/statistics/neud/dpa/showTable.cfm?type=HB&sector=tran&juris=00&rn=7&page=0

# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  efficiency: 9
  efficiencySource: Natural Resources Canada's 2023 on-road average for gasoline cars and light trucks, weighted by how far each type is driven
  distanceSource: 2009 Canadian Vehicle Survey
  estimated: true
