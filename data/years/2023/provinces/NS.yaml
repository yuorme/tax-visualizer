# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# Use the provincial July 2023 annual child-benefit amounts; CRA T4114-23 retains stale partial-band figures.
# Halifax rate is the published 2023/24 comparison: urban 0.760 + mandatory 0.355 per $100.

code: NS
name: Nova Scotia
order: 11
brackets:
  - [29590, 0.0879]
  - [59180, 0.1495]
  - [93000, 0.1667]
  - [150000, 0.175]
  - [.inf, 0.21]
basicPersonalAmount: {max: 11481, min: 8481, from: 25000, to: 75000}
dividendTaxCredit: {eligible: 0.0885, nonEligible: 0.0299}
spouseAmount:
  program: nova-scotia-spouse-amount
  params:
    max: 8481
    threshold: 848
    supplement: {max: 3000, rate: 0.06, threshold: 25000}
childAmount: {perChild: 1200, ages: under6}
lowIncomeReduction:
  program: family-low-income-reduction
  params: {individual: 300, spouse: 300, child: 165, rate: 0.05, threshold: 15000}
salesTax: {rate: 0.15, label: 15% HST}
