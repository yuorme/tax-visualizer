# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# Use the provincial July 2023 annual child-benefit amounts; CRA T4114-23 retains stale partial-band figures.
# Halifax rate is the published 2023/24 comparison: urban 0.760 + mandatory 0.355 per $100.

