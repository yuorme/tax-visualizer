# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# Property estimate uses Winnipeg School Division: (12.900 municipal + 13.539 school) mills × 45% / 1000.
# School-tax share is 13.539 / 26.439; gross property tax is before the 50% rebate and capped $350 credit.

code: MB
name: Manitoba
order: 5
brackets:
