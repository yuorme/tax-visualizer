spouseAmount: {max: 9134, threshold: 0}
salesTax: {rate: 0.12, label: 5% GST + 7% RST}
propertyTax: {rate: 0.011897550000000002, city: Winnipeg, estimated: true}
creditsUseRent: true
credits:
