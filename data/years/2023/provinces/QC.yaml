# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# Family allowance uses calendar 2023; solidarity credit uses July 2023–June 2024.
# Solidarity housing amounts include the budget enhancement to 821/677/144; the initial 2023 parameters booklet predates it.
# Living-alone amount retains the model assumption that every one-adult household qualifies.
# Property estimate uses the citywide residual residential average in budget 2023 Table 126: 0.7414 per $100.

