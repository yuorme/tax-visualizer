# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# July–December 2023 and January–June 2024 each contribute six months (weight 0.5) to the benefit year.
# Compute each period separately: the January 2024 quadrupling changed both maxima and taper rates.
# Exact annual per-child increments are differences between published cumulative maxima; no rounded monthly annualization.

