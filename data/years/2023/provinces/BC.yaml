# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 12900
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: BC carbon tax
  gasoline:
    - from: 2023-01-01
      rate: 0.1105
    - from: 2023-04-01
      rate: 0.1431
  heating:
    amount: 149.98
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 48.5060 GJ gas and 0.2385 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: BC climate action tax credit
      params:
        payments:
          - date: 2023-01-01
            adult: 212.375
            spouse: 212.375
            child: 55.125
            firstChild: 212.375
            threshold: [36901, 43051]
            rate: 0.005
          - date: 2023-04-01
            adult: 212.375
            spouse: 212.375
            child: 55.125
            firstChild: 212.375
            threshold: [36901, 43051]
            rate: 0.005
          - date: 2023-07-01
            adult: 111.75
            spouse: 55.875
            child: 27.875
            firstChild: 55.875
            threshold: [39115, 50170]
            rate: 0.005
          - date: 2023-10-01
            adult: 111.75
            spouse: 55.875
            child: 27.875
            firstChild: 55.875
            threshold: [39115, 50170]
            rate: 0.005
