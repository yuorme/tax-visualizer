# Historical driving defaults use a common survey baseline; see cited sources.
driving:
  distance: 15100
  estimated: true

# Calendar-year carbon charges and cash rebates; heating is an explicit modeled estimate.
carbon:
  name: Federal carbon pricing
  gasoline:
    - from: 2023-01-01
      rate: 0.1105
    - from: 2023-07-01
      rate: 0.1431
  heating:
    amount: 59.39
    estimated: true
    method: 2021 Statistics Canada household natural gas and heating oil use averaged across all households; 0.0000 GJ gas and 35.2661 GJ oil, held constant across years; calendar-day rates and applicable heating exemptions. See carbon heating verification.
  rebates:
    - program: carbon-rebate-payments
      name: Climate Action Incentive / Canada Carbon Rebate
      params:
        payments:
          - date: 2023-07-01
            adult: 120
            spouse: 60
            child: 30
            firstChild: 60
            threshold: [0, 0]
            rate: 0
          - date: 2023-10-01
            adult: 120
            spouse: 60
            child: 30
            firstChild: 60
            threshold: [0, 0]
            rate: 0
