# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# Child maximum annualizes rounded CRA monthly $28.91 ×12 = $346.92.
# Reduction rates 3%/5% are assumed unchanged from the Nunavut-commissioned 2013 report.
# Property uses 2023 residential classes 7/8 at 20.33 mills; assumes input home value approximates taxable assessment.

code: NU
name: Nunavut
territory: true
order: 6
brackets:
  - [50877, 0.04]
  - [101754, 0.07]
  - [165429, 0.09]
  - [.inf, 0.115]
basicPersonalAmount: 17925
dividendTaxCredit: {eligible: 0.0551, nonEligible: 0.0261}
spouseAmount: {max: 17925, threshold: 0}
childAmount: {perChild: 1200, ages: under6}
payroll: {employeeTax: 0.02}
salesTax: {rate: 0.05, label: 5% GST}
propertyTax: {rate: 0.02033, city: Iqaluit, estimated: true}
childBenefit:
  name: Nunavut Child Benefit
  program: per-child-reduced
  params: {perChild: 346.92, threshold: 21999, rateOneChild: 0.03, rateMoreChildren: 0.05}
  rateSource: Nunavut Anti-Poverty Secretariat commissioned report (2013), page 49; rates assumed unchanged
  estimated: true
