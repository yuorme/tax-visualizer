# Benefit-year figures use July 2023 to June 2024, applied to current-year income.
# NWT Finance publishes exact annual child-benefit amounts and the linear reduction formula, effective July 2017.
# Yellowknife total residential rate: (6.28 municipal + 2.96 school) mills / 1000.

code: NT
name: Northwest Territories
territory: true
order: 3
brackets:
  - [48326, 0.059]
  - [96655, 0.086]
  - [157139, 0.122]
  - [.inf, 0.1405]
basicPersonalAmount: 16593
dividendTaxCredit: {eligible: 0.115, nonEligible: 0.06}
spouseAmount: {max: 16593, threshold: 0}
payroll: {employeeTax: 0.02}
salesTax: {rate: 0.05, label: 5% GST}
propertyTax: {rate: 0.00924, city: Yellowknife}
