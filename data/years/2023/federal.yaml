# Federal parameters for the 2023 tax year.
# Recurring benefits use July 2023–June 2024 amounts (2022 income administratively), applied to current-year
# income for this comparison. The July 2023 one-time Grocery Rebate belongs to the prior benefit period.
year: 2023

# T4127 January 2023, tables 8.1–8.2 and BPAF formula.
brackets:
  - [53359, 0.15]
  - [106717, 0.205]
  - [165430, 0.26]
  - [235675, 0.29]
  - [.inf, 0.33]
basicPersonalAmount: {max: 15000, min: 13521, from: 165430, to: 235675}
quebecAbatement: 0.165
employmentAmount: 1368
indexation: 0.063

investment:
  # Schedule 3 line 21; Finance Canada's 2024 tax-expenditures report explicitly states 2023 dividend rates.
  capitalGainsInclusion: 0.5
  grossUp: {eligible: 1.38, nonEligible: 1.15}
  dividendTaxCredit: {eligible: 0.150198, nonEligible: 0.090301}
  # Treaty Article X(2)(b), and Income Tax Act subsection 20(11).
  foreignWithholding: {usTreaty: 0.15, deductibleAbove: 0.15}

# CRA registered-plan limits, RRSP column (not the $31,560 money-purchase column).
rrsp: {rate: 0.18, limit: 30780}

# T4127 tables 8.3–8.7. Second additional CPP/QPP starts in 2024: zero enh2 and no second earnings band.
payroll:
  cpp: {exempt: 3500, ympe: 66600, yampe: 66600, base: 0.0495, enh1: 0.01, enh2: 0}
  qpp: {exempt: 3500, ympe: 66600, yampe: 66600, base: 0.054, enh1: 0.01, enh2: 0}
  ei: {maxInsurable: 61500, rate: 0.0163, quebecRate: 0.0127}
  qpip: {maxInsurable: 91000, rate: 0.00494}

childBenefit: # T4114, July 2023–June 2024, pp.15–16.
  perChildUnder6: 7437
  perChild6to17: 6275
  threshold1: 34863
  threshold2: 75537
  rate1: [0, 0.07, 0.135, 0.19, 0.23]
  fixed2: [0, 2847, 5491, 7728, 9355]
  rate2: [0, 0.032, 0.057, 0.08, 0.095]

groceriesBenefit: # CRA calculation sheet for July 2023–June 2024, 2022 base year.
  name: GST/HST credit
  adult: 325
  spouseOrFirstChild: 325
  child: 171
  singleSupplement: {max: 171, rate: 0.02, from: 10544}
  phaseOut: {rate: 0.05, from: 42335}

workersBenefit: # 2023 Schedule 6; disability supplement excluded; advanced instalments are not extra benefits.
  # Quebec's income-at-maximum thresholds are derived as excluded earnings + published maximum / phase-in:
  # single 2400+3521.87/.373; couple 3600+5497.27/.373; parent 2400+1888.40/.20;
  # couple with children 3600+3522.38/.239. Exact quotients preserve the published maximum amounts.
  estimated: true
  estimationNote: "Quebec's income-at-maximum thresholds are derived from the published Schedule 6 maxima divided by their phase-in rates, plus excluded earnings; all benefit amounts and reduction thresholds are published 2023 values"
  standard: {max: [1518, 2616], rate: 0.27, floor: [3000, 3000], threshold: [24975, 28494], phaseOut: [0.15, 0.15]}
  secondaryEarnerExemption: 15239
  regional:
    AB: {max: [1627, 2436], rate: 0.21, floor: [2760, 2760], threshold: [24328, 30478], phaseOut: [0.15, 0.15]}
    NU: {max: [1508, 2264], rate: 0.14, floor: [6000, 6000], threshold: [24954, 34343], phaseOut: [0.04, 0.08]}
  quebec:
    phaseOutRate: 0.20
    single: [0.373, 2400, 11842.010723860589, 13294.87]
    couple: [0.373, 3600, 18337.98927613941, 20412.45]
    parent: [0.20, 2400, 11842, 13400.24]
    coupleKids: [0.239, 3600, 18337.991631799166, 20563.57]

